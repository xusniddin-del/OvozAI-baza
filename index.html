    <div class="lb">Tarif</div><div class="seg" id="eplan">${CONFIG.PLANS.map(p=>`<button data-p="${p.id}" class="${p.id===plan?"on":""}">${esc(p.name)}</button>`).join("")}</div>
    <div class="lb">Holat</div><div class="seg" id="estat"><button data-s="active" class="${status==="active"?"on":""}">Faol</button><button data-s="blocked" class="${status==="blocked"?"on":""}">Bloklangan</button></div>
    <label class="chk"><input type="checkbox" id="erst"> Bugungi sarfni nolga tushirish</label>
    <label class="chk"><input type="checkbox" id="eout"> Barcha qurilmalardan chiqarib yuborish</label>
    <div class="mdf"><div class="flex1"></div><button class="btn-l" data-close>Bekor qilish</button><button class="btn-k" id="esv">Saqlash</button></div>`);
  el.querySelector("#eplan").onclick = e => { const x = e.target.closest("button"); if(!x) return; plan = x.dataset.p; el.querySelectorAll("#eplan button").forEach(y=>y.classList.toggle("on", y===x)); };
  el.querySelector("#estat").onclick = e => { const x = e.target.closest("button"); if(!x) return; status = x.dataset.s; el.querySelectorAll("#estat button").forEach(y=>y.classList.toggle("on", y===x)); };
  el.querySelector("#esv").onclick = async () => {
    const d = {id:u.id};
    if(plan !== u.plan) d.plan = plan;
    if(status !== u.status) d.status = status;
    if(el.querySelector("#erst").checked) d.resetUsage = true;
    if(el.querySelector("#eout").checked) d.logoutAll = true;
    if(Object.keys(d).length === 1) return close();
    if(status==="blocked" && u.status!=="blocked" && !confirm(`${u.name} bloklansinmi? U saytdan chiqarib yuboriladi.`)) return;
    const r = await aapi("update", d);
    if(!r.ok) return toast(apiFail(r).error || "Saqlanmadi");
    close(); toast("Saqlandi ✓"); done && done();
  };
}

/* ---- Jonli bezak: ketma-ket paydo bo'lish va sichqoncha nuri ---- */
const STG_SEL = ".tool,.tv,.pick2,.pc2,.bk,.chr,.vrow,.ar,.info,.stc,.tchip,.s2";
const SP_SEL = ".tool,.tv,.pc2,.box,.info,.rf,.tip,.vrow,.ar,.chr,.banner3";
function decorate(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll(SP_SEL).forEach(el => el.classList.add("sp"));
  const groups = new Map();
  root.querySelectorAll(STG_SEL).forEach(el => {
    if(el.dataset.stg) return; el.dataset.stg = 1;
    const p = el.parentNode, n = groups.get(p) || 0; groups.set(p, n+1);
    el.style.setProperty("--i", Math.min(n, 14)); el.classList.add("stg");
  });
}
new MutationObserver(ms => { if(!document.body.classList.contains("light")) return;
  for(const m of ms) m.addedNodes.forEach(n => { if(n.nodeType===1) decorate(n.parentNode || n); }); })
  .observe(document.getElementById("app"), {childList:true, subtree:true});

   Router
   ============================================================ */
function route(){
  clearTimers();
  document.querySelectorAll(".md").forEach(m=>m.remove());
  const raw = (location.hash||"#/").replace(/^#/,"") || "/";
  const [h, qs] = raw.split("?");
  const ref = new URLSearchParams(qs||"").get("ref") || new URLSearchParams(location.search).get("ref");
  if(ref){ try{ localStorage.setItem("ovoz_ref", ref); }catch(e){} }
  const isApp = h.startsWith("/app") || h==="/studio";
  document.body.classList.toggle("light", isApp);
  document.body.dataset.page = isApp ? (h.split("/")[2] || "home") : "site";
  window.scrollTo(0,0);
  const app = $("#app");
  if(isApp){
    if(!store.token){ location.hash="#/login"; return; }
    const seg = h.split("/"), page = seg[2] || "home";
    renderApp(PAGES[page] ? page : "home", seg[3]); return;
  }
  if(h==="/tg"){ document.body.dataset.page = "tg"; tgUpPage(); return; }
  if(h==="/login" || h==="/register" || h==="/reset"){
    if(store.token){ location.hash="#/app"; return; }
    const mode = h.slice(1);
    app.innerHTML = authPage(mode); bindNav(); bindAuth(mode); return;
  }
  app.innerHTML = landing(); bindNav(); bindLanding(); bindFx();
}
window.addEventListener("hashchange", route);

      <button class="btn-l" id="tpick">🖼 Boshqa rasm</button></div>
    <button class="tgub" id="tgo" hidden>✨ Tiniqlashtirish</button>
    <div id="tout"></div>
    <p class="tgun">🔒 Rasm telefoningizda ishlanadi. Birinchi marta ~5 MB model yuklanadi.</p></div>`;
  let TG = null;
  try{ await loadJS("https://telegram.org/js/telegram-web-app.js"); TG = window.Telegram && Telegram.WebApp; }catch(e){}
  const init = TG && TG.initData || "";
  if(TG){ try{ TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor("#060b1e"); TG.setBackgroundColor && TG.setBackgroundColor("#060b1e"); }catch(e){} }
  let src = null, scale = 2, out = null;
  const st = (h) => { const e = $("#tst"); if(e){ e.innerHTML = h; e.hidden = !h; } };
  const info = () => { if(!src) return; const f = upFit(src.w, src.h, scale);
    $("#tsz").textContent = `${src.w}×${src.h} → ${f.w*scale}×${f.h*scale}`; };
  const setImg = async (blob, name) => {
    const url = URL.createObjectURL(blob), img = new Image(); img.src = url;
    try{ await img.decode(); }catch(e){ st("Rasmni ochib bo'lmadi. Boshqa rasm tanlang."); $("#tctl").hidden = false; return; }
    src = {img, url, w:img.naturalWidth, h:img.naturalHeight, name:(name||"rasm").replace(/\.[^.]+$/,"")};
    $("#timg").src = url; $("#tim").hidden = false; $("#tctl").hidden = false; $("#tgo").hidden = false; $("#tout").innerHTML = ""; st(""); info();
    upLoad().catch(()=>{});   // modelni oldindan yuklab qo'yish
  };
  $("#tpick").onclick = () => $("#tfile").click();
  $("#tfile").onchange = e => { const f = e.target.files[0]; if(f) setImg(f, f.name); };
  $("#tsc").onclick = e => { const b = e.target.closest("button"); if(!b || BUSY) return;
    $("#tsc").querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); scale = +b.dataset.s; info(); };

  // botga yuborilgan oxirgi rasm
  if(init){
    const r = await api("tgup_get", {init});
    if(r.ok && r.img){ const bin = Uint8Array.from(atob(r.img), c=>c.charCodeAt(0)); await setImg(new Blob([bin], {type:r.mime||"image/jpeg"}), r.name); }
    else { st("Rasm tanlang yoki botga rasm yuboring 👇"); $("#tctl").hidden = false; }
  } else { st("Rasm tanlang 👇"); $("#tctl").hidden = false; }

  $("#tgo").onclick = async () => {
    if(!src || BUSY) return; BUSY = true; const go = $("#tgo"); go.disabled = true;
    const bar = (t, v) => { $("#tout").innerHTML = `<div class="upbar"><div class="upbt"><span>${t}</span><b>${v!=null ? Math.round(v*100)+"%" : ""}</b></div><i><s style="width:${(v||0)*100}%"></s></i></div>`; };
    try{
      bar("Model yuklanmoqda..."); await upLoad();
      const f = upFit(src.w, src.h, scale), cv = document.createElement("canvas");
      cv.width = f.w; cv.height = f.h; const cx = cv.getContext("2d"); cx.imageSmoothingQuality = "high"; cx.drawImage(src.img, 0, 0, f.w, f.h);
      let blob = await upRun(cv, scale, v => bar("Tiniqlashtirilmoqda...", v));
      // Telegram uchun: katta PNG (shaffofsiz) → sifatli JPEG
      let mime = "image/png";
      if(blob.size > 4*1024*1024){
        const im = await createImageBitmap(blob), c2 = document.createElement("canvas"); c2.width = im.width; c2.height = im.height;
        const x2 = c2.getContext("2d"); x2.fillStyle = "#fff"; x2.fillRect(0,0,c2.width,c2.height); x2.drawImage(im, 0, 0);
        blob = await new Promise(r => c2.toBlob(r, "image/jpeg", 0.93)); mime = "image/jpeg";
      }
      if(out) URL.revokeObjectURL(out);
      out = URL.createObjectURL(blob); const W = f.w*scale, H = f.h*scale, size = `${W}×${H}`;
      $("#tout").innerHTML = `<div class="upcmp" id="tcmp" style="--x:50%;aspect-ratio:${W}/${H};width:min(100%, calc(60vh * ${(W/H).toFixed(4)}))"><img src="${out}" alt="Keyin"><img class="upb" src="${src.url}" alt="Oldin">
        <span class="uplb l">Oldin</span><span class="uplb r">Keyin · ${scale}x</span><span class="upln"><i>⟷</i></span><input type="range" min="0" max="100" value="50"></div>
        <div id="tsend"></div>`;
      $("#tcmp input").oninput = e => $("#tcmp").style.setProperty("--x", e.target.value + "%");
      if(!init){ $("#tsend").innerHTML = `<a class="tgub" href="${out}" download="${esc(src.name)}-${scale}x.${mime==="image/png"?"png":"jpg"}">⬇ Yuklab olish</a>`; return; }
      $("#tsend").innerHTML = `<div class="tgus"><span class="spin"></span> Chatga yuborilmoqda...</div>`;
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
      const r = await api("tgup_send", {init, data:b64, mime, scale, name:src.name, size});
      if(r.ok){ $("#tsend").innerHTML = `<div class="tgus ok">✅ Tayyor! Rasm chatga fayl bo'lib yuborildi.</div><button class="tgub" id="tcl">Chatga qaytish</button>`;
        $("#tcl").onclick = () => TG && TG.close(); if(TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success"); }
      else $("#tsend").innerHTML = `<div class="msg err">${esc(r.error || "Yuborib bo'lmadi")}</div><a class="tgub" href="${out}" download="${esc(src.name)}-${scale}x.png">⬇ Yuklab olish</a>`;
    }catch(e){
      console.error(e); $("#tout").innerHTML = `<div class="msg err">Rasmni ishlab bo'lmadi. Kichikroq rasm yoki 2x bilan urinib ko'ring.</div>`;
    }finally{ BUSY = false; go.disabled = false; }
  };
}

  function setMood(m, ms){

  let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
  function look(x, y){

    const r = el.getBoundingClientRect(), mx = r.left + r.width/2, my = r.top + r.height*0.52;
    const dx = x - mx, dy = y - my, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d/220);
    tx = dx/d*4.2*k; ty = dy/d*3.4*k;
    if(!raf) raf = requestAnimationFrame(step);
  }
  function step(){
    cx += (tx - cx)*0.25; cy += (ty - cy)*0.25;

    svg.querySelector(".gp-head").style.transform = `translate(${(cx*0.35).toFixed(2)}px,${(cy*0.25).toFixed(2)}px)`;

  function notes(){

  const GO = {plans:["Tariflar","#/app/plans"], tts:["Ovoz yaratish","#/app/tts"], voices:["Ovozlar","#/app/voices"], stt:["Nutqdan matnga","#/app/stt"],
    dub:["Dublyaj","#/app/dub"], books:["Audiokitob","#/app/books"], connect:["Claude'ga ulash","#/app/connect"], upscale:["Rasmni tiniqlash","#/app/upscale"], ref:["Takliflar","#/app/ref"],
    assets:["Fayllarim","#/app/assets"], register:["Ro'yxatdan o'tish","#/register"], login:["Kirish","#/login"], reset:["Parolni tiklash","#/reset"]};
  function splitActs(t){ const acts = []; t = String(t).replace(/\[\[go:([a-z]+)\]\]/g, (m, k) => { if(GO[k] && !acts.includes(k)) acts.push(k); return ""; }).trim(); return {t, acts}; }

  }

  function reply(raw){
    const {t: w, acts} = splitActs(raw);

    const tick = () => { i = Math.min(w.length, i + 3); m.textContent = w.slice(0, i); log.scrollTop = log.scrollHeight;
      if(i < w.length) setTimeout(tick, 12); else { setMood("happy", 2200); addActs(acts); } };
    tick();
  }

  async function send(t){
    t = (t || inp.value).trim(); if(!t || busy) return;
    inp.value = ""; addMsg("u", t);
    const q = quick(t);
    if(q){ busy = true; setMood("laugh"); await new Promise(r => setTimeout(r, 350)); busy = false;
      hist.push({r:"u", t}, {r:"a", t:q}); saveHist(); reply(q); return; }
    busy = true; setMood("dance"); notes();
    const nt = setInterval(notes, 900);
    const typing = addMsg("a", ""); typing.classList.add("typing"); typing.innerHTML = "<i></i><i></i><i></i>";
    const r = await Promise.race([api("chat", {cid, text: t, history: hist.slice(-12).map(m => ({r:m.r, t:splitActs(m.t).t})), facts: facts()}),
      new Promise(res => setTimeout(() => res({ok:false, error:"Javob kechikyapti 😅 Savolni qisqaroq yozing yoki birozdan keyin qayta so'rang."}), 25000))]);
    clearInterval(nt); busy = false; typing.remove();
    if(!r.ok){ addMsg("a", r.error || "Hozir javob bera olmayman 😔"); setMood("sad", 2600); return; }
    hist.push({r:"u", t}, {r:"a", t:r.text}); saveHist();

  function toggle(v){
    open = v == null ? !open : v;

  function mount(){
    if(el) return;
    el = document.createElement("button"); el.className = "gapi"; el.setAttribute("aria-label", "Gapi yordamchisi bilan suhbat");
    el.innerHTML = svgHTML(); document.body.append(el);
    svg = el.querySelector("svg"); eyes = svg.querySelector(".gp-eyes"); svg.dataset.face = "o";
    panel = document.createElement("div"); panel.className = "gp-panel"; panel.setAttribute("role","dialog"); panel.setAttribute("aria-label","Gapi yordamchisi");
    panel.innerHTML = `<div class="gp-h"><span class="gp-av">${svgHTML()}</span><div><b>Gapi</b><small><i></i> Nevra yordamchisi</small></div>
        <button class="gp-x" aria-label="Yopish">✕</button></div>
      <div class="gp-log" id="gpLog"></div>
      <div class="gp-chips">${["Qanday ishlaydi?","Tariflar qanaqa?","O'zbekcha gapiradimi?","Bepul limit qancha?"].map(c=>`<button>${c}</button>`).join("")}</div>
      <form class="gp-f"><input placeholder="Gapiga yozing..." maxlength="600" aria-label="Xabar"><button aria-label="Yuborish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>`;
    document.body.append(panel);
    panel.querySelector(".gp-av svg").querySelectorAll("[id]").forEach(n => n.id += "2");
    panel.querySelector(".gp-av svg").innerHTML = panel.querySelector(".gp-av svg").innerHTML.replace(/url\(#(gp\w+)\)/g, "url(#$12)");
    log = panel.querySelector(".gp-log"); inp = panel.querySelector("input");
    addMsg("a", "Salom! Men Gapi 👋 Nevra haqida istalgan savolingizga javob beraman. Nimani bilmoqchisiz?");
    hist.slice(-10).forEach(m => { if(m.r === "u") addMsg("u", m.t); else addMsg("a", splitActs(m.t).t); });
    el.onclick = () => toggle();
    panel.querySelector(".gp-x").onclick = () => toggle(false);
    panel.querySelector(".gp-f").onsubmit = e => { e.preventDefault(); send(); };
    panel.querySelector(".gp-chips").onclick = e => { const b = e.target.closest("button"); if(b) send(b.textContent); };
    inp.addEventListener("input", () => { if(!busy && mood !== "talk") setMood(inp.value ? "listen" : "smile"); });
    inp.addEventListener("focus", () => { const r = inp.getBoundingClientRect(); look(r.left + 40, r.top); });
    document.addEventListener("keydown", e => { if(e.key === "Escape" && open) toggle(false); });
    el.addEventListener("mouseenter", () => { if(!busy && !open) setMood("happy"); });
    el.addEventListener("mouseleave", () => { if(!busy && !open) setMood("smile"); });
    document.addEventListener("mousemove", e => look(e.clientX, e.clientY), {passive:true});
    setTimeout(blink, 1800);
    setTimeout(() => { if(!open && el && !document.body.classList.contains("light") && !sessionStorage.getItem("gp_tip")){
      const t = document.createElement("div"); t.className = "gp-tip"; t.innerHTML = "Salom! Men <b>Gapi</b> 👋 Savolingiz bormi?";
      t.onclick = () => toggle(true); document.body.append(t); try{ sessionStorage.setItem("gp_tip","1"); }catch(e){}
      setMood("wink", 1200); setTimeout(() => t.remove(), 9000); } }, 4000);
  }

  return {mount, mood: setMood, dance(){ setMood("dance"); notes(); }, happy(){ setMood("laugh", 2200); }, sad(){ setMood("sad", 2600); }};
})();

route();
loadBot();   // narxlar, chegirma va bot nomi serverdan
Gapi.mount();

</script>
</body>
