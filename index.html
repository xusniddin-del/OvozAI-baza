<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OvozAI — Matnni tabiiy ovozga aylantiring</title>
<meta name="description" content="Matnni bir necha soniyada tabiiy o'zbekcha ovozga aylantiring. 30 ta ovoz, uslub tanlash, WAV yuklab olish.">
<meta name="theme-color" content="#03050f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03050f; --ink:#eef2ff; --muted:#8e9cc7; --blue:#2f6bff; --blue2:#5b8cff; --cyan:#34e0c8; --violet:#8b5cff;
  --glass:rgba(255,255,255,.045); --line:rgba(130,165,255,.18);
  --ok:#34d399; --err:#ff6b6b;
  --grad:linear-gradient(135deg,#2358ff 0%,#4a7dff 55%,#7aa8ff 100%);
  --fh:'Unbounded','Manrope',system-ui,sans-serif;
  --fb:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;color-scheme:dark}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{position:relative;z-index:2}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}

/* ---------- jonli fon ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;will-change:transform}
.aurora i:nth-child(1){width:520px;height:520px;background:#2f6bff;left:-8%;top:8%;animation:dr1 22s ease-in-out infinite}
.aurora i:nth-child(2){width:460px;height:460px;background:#7b4dff;right:-6%;top:30%;animation:dr2 26s ease-in-out infinite}
.aurora i:nth-child(3){width:420px;height:420px;background:#12c8b4;left:30%;bottom:-12%;animation:dr3 30s ease-in-out infinite;opacity:.22}
@keyframes dr1{0%,100%{transform:translate(0,0)}50%{transform:translate(160px,120px)}}
@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-180px,-90px)}}
@keyframes dr3{0%,100%{transform:translate(0,0)}50%{transform:translate(140px,-120px)}}
.spot{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),rgba(110,160,255,.13),transparent 65%)}

/* ---------- nav ---------- */
.nav{position:absolute;top:0;left:0;right:0;z-index:50}
.nav.fix{position:sticky;background:rgba(3,5,15,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:500;font-size:16px;letter-spacing:-.01em}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px rgba(47,107,255,.6)}
.logo i svg{width:19px;height:19px}
.links{display:flex;gap:4px;padding:5px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);font-size:13px;font-weight:600;color:#b9c6ea}
.links a{padding:8px 17px;border-radius:99px;transition:.2s}
.links a:hover{color:#fff;background:rgba(255,255,255,.09)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:99px;font-weight:700;font-size:14px;transition:.25s;white-space:nowrap}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 8px 28px rgba(47,107,255,.5)}
.btn-p:before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:.6s}
.btn-p:hover:before{left:130%}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 14px 38px rgba(47,107,255,.7)}
.btn-p:disabled{opacity:.6;transform:none;cursor:wait}
.btn-g{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#dbe5ff}
.btn-g:hover{border-color:var(--blue2);color:#fff}
.btn-lg{padding:16px 32px;font-size:15px}

/* ---------- hero ---------- */
.hero{position:relative;padding:150px 0 0;text-align:center}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stars span{position:absolute;border-radius:50%;background:#9db8ff;opacity:.5;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.95;transform:scale(1.2)}}
.shoot{position:absolute;top:12%;left:70%;width:110px;height:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(215deg);opacity:0;animation:sh 7s ease-in infinite 2s}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(215deg)}4%{opacity:1}14%{opacity:0;transform:translate(-340px,230px) rotate(215deg)}100%{opacity:0}}
.beam{position:absolute;left:50%;top:0;transform:translateX(-50%);width:300px;height:720px;background:linear-gradient(180deg,rgba(60,120,255,0),rgba(70,130,255,.9) 52%,rgba(60,120,255,0));filter:blur(46px);animation:bm 5s ease-in-out infinite;pointer-events:none}
@keyframes bm{0%,100%{opacity:.55;width:260px}50%{opacity:.95;width:360px}}
.beam:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:linear-gradient(180deg,transparent,#d6e4ff 55%,transparent)}
.hero .wrap{position:relative}
.tag{display:inline-flex;align-items:center;gap:9px;padding:8px 17px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);font-size:12.5px;font-weight:600;color:#d3deff}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(52,224,200,.7);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(52,224,200,0)}100%{box-shadow:0 0 0 0 rgba(52,224,200,0)}}
.tag svg{width:14px;height:14px}
h1{font-family:var(--fh);font-size:clamp(28px,4.7vw,58px);line-height:1.14;letter-spacing:-.035em;font-weight:500;margin:26px auto 22px;max-width:960px}
.w{display:inline-block;margin:0 .13em;opacity:0;transform:translateY(34px);filter:blur(10px);animation:wi .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.1s + .15s);background:linear-gradient(180deg,#fff 30%,#a9bcf5);-webkit-background-clip:text;background-clip:text;color:transparent}
.w.hl{background:linear-gradient(90deg,#5b8cff,#34e0c8,#8b5cff,#5b8cff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:wi .95s cubic-bezier(.2,.7,.2,1) forwards,sf 6s linear infinite;animation-delay:calc(var(--i)*.1s + .15s),0s}
@keyframes wi{to{opacity:1;transform:none;filter:none}}
@keyframes sf{to{background-position:300% 0}}
.lead{font-size:clamp(14.5px,1.8vw,17px);color:var(--muted);max-width:540px;margin:0 auto 34px;font-weight:500;opacity:0;animation:fu .9s .7s forwards}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero-form{display:flex;align-items:center;gap:8px;max-width:530px;margin:0 auto;padding:7px 7px 7px 22px;border-radius:99px;border:1px solid rgba(130,170,255,.4);background:rgba(8,16,40,.6);backdrop-filter:blur(14px);box-shadow:0 0 44px rgba(47,107,255,.3);opacity:0;animation:fu .9s .9s forwards}
.hero-form svg{width:20px;height:20px;flex:none;color:#9db3f0}
.hero-form input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14.5px;padding:10px 4px}
.hero-form input::placeholder{color:#8493bd}
.hero-form .pre{font-weight:700;color:#b9c6ea;font-size:14.5px;margin-left:-2px}
.phf{display:flex;align-items:center;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);transition:.2s}
.phf:focus-within{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(47,107,255,.22);background:rgba(255,255,255,.07)}
.phf span{padding:0 0 0 16px;font-weight:700;color:#aab9e6;font-size:14.5px}
.phf input{border:0!important;background:none!important;box-shadow:none!important;padding-left:8px!important;letter-spacing:.02em}
.proof{margin-top:18px;font-size:12.5px;color:#7f8fba;font-weight:600;opacity:0;animation:fu .9s 1.1s forwards}

/* ---------- jonli dashboard ---------- */
.dashwrap{position:relative;max-width:1000px;margin:70px auto 0;perspective:1500px;opacity:0;animation:fu 1.1s 1.2s forwards}
.dash{position:relative;border-radius:22px;border:1px solid rgba(130,170,255,.32);background:linear-gradient(180deg,rgba(14,26,66,.86),rgba(4,8,22,.94));box-shadow:0 0 90px rgba(47,107,255,.32),0 1px 0 rgba(255,255,255,.14) inset;display:grid;grid-template-columns:170px 1fr;text-align:left;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 66%,transparent 100%);mask-image:linear-gradient(180deg,#000 66%,transparent 100%);padding:12px;gap:12px;transition:transform .25s ease-out;transform-style:preserve-3d}
.d-side{border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:14px 10px;min-height:430px}
.d-side .logo{font-size:11px;padding:2px 6px 16px}
.d-side .logo i{width:22px;height:22px;border-radius:7px}.d-side .logo i svg{width:12px;height:12px}
.d-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:11.5px;font-weight:600;color:#98a8d6;margin-bottom:3px}
.d-item.on{background:rgba(47,107,255,.24);color:#fff;border:1px solid rgba(110,160,255,.4)}
.d-item b{width:10px;height:10px;border-radius:3px;border:1.5px solid currentColor;opacity:.8}
.d-main{display:grid;gap:12px;align-content:start;min-width:0}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;border:1px solid rgba(110,160,255,.3);background:rgba(255,255,255,.04);font-size:12px;color:#d6e0ff;min-height:46px}
.d-top .ty{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-top .ty:before{content:"✦ ";color:var(--blue2)}
.d-top .ty u{display:inline-block;width:2px;height:13px;background:#8fb0ff;margin-left:2px;vertical-align:-2px;animation:bk 1s steps(2) infinite}
@keyframes bk{50%{opacity:0}}
.d-top .gb{flex:none;font-size:11px;font-weight:700;padding:8px 16px;border-radius:9px;background:var(--grad);box-shadow:0 0 18px rgba(47,107,255,.6);animation:gp 2.4s ease-in-out infinite}
@keyframes gp{50%{box-shadow:0 0 30px rgba(80,140,255,.95);transform:scale(1.04)}}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.d-card{border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(47,107,255,.22),rgba(255,255,255,.03));padding:14px}
.d-card small{display:block;color:#8d9dc9;font-size:10.5px;margin-top:20px;font-weight:600}
.d-card strong{font-family:var(--fh);font-size:22px;font-weight:500;letter-spacing:-.04em}
.d-card .mini{float:right;font-size:9.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:#b9c6ea}
.d-two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.d-panel{border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:14px;min-width:0;overflow:hidden}
.d-panel h6{font-size:12px;font-weight:700;margin-bottom:2px}
.d-panel p{font-size:10px;color:#7f8fba;margin-bottom:12px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:135px}
.bars i{flex:1;border-radius:4px;background:rgba(255,255,255,.11);transition:height 1s cubic-bezier(.3,.8,.3,1),background .6s;position:relative;transform-origin:bottom;animation:gr 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes gr{from{transform:scaleY(0)}}
.bars i.hl{background:linear-gradient(180deg,#4a85ff,#1c43c9);box-shadow:0 0 20px rgba(61,123,255,.75)}
.bars i.hl:after{content:attr(data-v) " audio";position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:9px;font-style:normal;white-space:nowrap;background:#2f6bff;padding:3px 8px;border-radius:5px;font-weight:700}
.act{display:grid;gap:9px}
.act div{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#a9b7df;font-weight:600;animation:si .6s cubic-bezier(.2,.8,.2,1)}
@keyframes si{from{opacity:0;transform:translateX(-18px)}}
.act div span:first-child{display:flex;align-items:center;gap:8px}
.act div span:first-child:before{content:"";width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#34e0c8);flex:none}
.act div span:last-child{color:#6f7fa9}
.fl{position:absolute;z-index:5;display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:15px;border:1px solid rgba(140,175,255,.4);background:rgba(10,18,48,.82);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(47,107,255,.25);font-size:12px;animation:fy 6s ease-in-out infinite}
.fl b{display:block;font-size:12.5px;font-weight:700}
.fl small{color:#92a3d6;font-weight:600;font-size:11px}
.fl .fi{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;flex:none;box-shadow:0 0 16px rgba(47,107,255,.7)}
.fl .ck{width:30px;height:30px;border-radius:50%;background:rgba(52,211,153,.2);color:var(--ok);display:grid;place-items:center;font-weight:800;flex:none}
.fl1{left:-48px;top:150px}.fl2{right:-40px;top:300px;animation-delay:-3s}.fl3{left:-30px;top:380px;animation-delay:-1.5s}
@keyframes fy{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mw{display:flex;align-items:center;gap:2px;height:22px}
.mw i{width:3px;border-radius:2px;background:linear-gradient(#7aa8ff,#2f6bff);animation:wv 1.1s ease-in-out infinite;height:30%}
@keyframes wv{0%,100%{height:15%}50%{height:100%}}

/* ---------- marquee ---------- */
.uses{padding:60px 0 10px;text-align:center;overflow:hidden}
.uses p{font-size:12px;color:#7b8ab4;margin-bottom:24px;letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.mq{display:flex;width:max-content;animation:mq 28s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.uses{-webkit-mask-image:none}
.mq-wrap{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq{-webkit-mask-image:none}
.mq span{display:flex;align-items:center;gap:10px;margin:0 28px;font-family:var(--fh);font-weight:500;font-size:15px;color:#6f7eaa;white-space:nowrap}
.mq span:before{content:"✦";color:var(--blue2)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
section{padding:90px 0;position:relative}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.sec-h{text-align:center;max-width:720px;margin:0 auto 48px}
.sec-h .tag{margin-bottom:22px}
.sec-h h2{font-family:var(--fh);font-size:clamp(24px,3.6vw,40px);letter-spacing:-.035em;line-height:1.18;font-weight:500;color:#fff}
.sec-h h2 span{background:linear-gradient(90deg,#6c9aff,#34e0c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-h p{color:var(--muted);margin-top:14px;font-size:15px;font-weight:500}
.sp{position:relative}
.sp:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(300px circle at var(--x,50%) var(--y,0%),rgba(100,150,255,.24),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.sp:hover:before{opacity:1}
.sp:hover{border-color:rgba(130,170,255,.5)!important}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1000px;margin:0 auto}
.bcard{border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.018));padding:28px 28px 0;overflow:hidden;min-height:350px;display:flex;flex-direction:column;transition:border-color .3s}
.bcard h3{font-family:var(--fh);font-size:15px;font-weight:500;margin-bottom:8px}
.bcard p{font-size:14px;color:var(--muted);max-width:350px;font-weight:500}
.bvis{margin-top:auto;position:relative;height:195px}
.v1 .box{position:absolute;left:0;right:30px;bottom:-1px;border-radius:14px 14px 0 0;border:1px solid var(--line);background:rgba(6,12,32,.92);padding:14px}
.v1 .in{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#cfdbff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:rgba(255,255,255,.04);font-weight:600}
.v1 .in u{width:2px;height:12px;background:#8fb0ff;animation:bk 1s steps(2) infinite}
.v1 .in b{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;color:#fff}
.v1 .opt{margin-top:8px;font-size:11.5px;color:#b9c6ea;display:grid;gap:5px;font-weight:600}
.v1 .opt span{padding:7px 10px;border-radius:8px;transition:.4s;border:1px solid transparent}
.v1 .opt span.on{background:rgba(47,107,255,.28);border-color:rgba(110,160,255,.4);color:#fff}
.v2 .st{position:absolute;left:12%;right:-8%;padding:13px 16px;border-radius:12px;border:1px solid rgba(130,170,255,.32);background:linear-gradient(135deg,rgba(25,55,140,.92),rgba(8,16,44,.96));font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;justify-content:space-between;align-items:center;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.v2 .st small{color:#8fa3d8;font-weight:600}
.v2 .st:nth-child(1){top:14px;transform:rotate(-4deg)}
.v2 .st:nth-child(2){top:62px;transform:rotate(-4deg) translateX(18px)}
.v2 .st:nth-child(3){top:110px;transform:rotate(-4deg) translateX(36px)}
.bcard:hover .v2 .st:nth-child(1){transform:rotate(-4deg) translate(-8px,-6px)}
.bcard:hover .v2 .st:nth-child(3){transform:rotate(-4deg) translate(52px,8px)}
.v3 .orb{position:absolute;left:50%;bottom:-120px;width:300px;height:300px;transform:translateX(-50%);border-radius:50%;border:1px solid rgba(110,160,255,.32);display:grid;place-items:center}
.v3 .orb:before,.v3 .orb:after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(110,160,255,.3);animation:rt 24s linear infinite}
.v3 .orb:before{inset:34px}.v3 .orb:after{inset:72px;animation-direction:reverse;animation-duration:16s}
@keyframes rt{to{transform:rotate(360deg)}}
.v3 .orb i{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9cc0ff,#2f6bff 55%,#0b2a9a);box-shadow:0 0 60px rgba(47,107,255,.95);display:block;animation:ob 3s ease-in-out infinite}
@keyframes ob{50%{transform:scale(1.13);box-shadow:0 0 90px rgba(80,140,255,1)}}
.v3 .cp{position:absolute;font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(8,16,40,.88);color:#c6d3fa;animation:fy 5s ease-in-out infinite}
.v4 .pl{position:absolute;left:14px;right:14px;bottom:-1px;border-radius:14px 14px 0 0;border:1px solid var(--line);background:rgba(6,12,32,.92);padding:16px}
.v4 .row{display:flex;align-items:center;gap:12px}
.v4 .pb{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 0 20px rgba(47,107,255,.7)}
.v4 .pb svg{width:13px;margin-left:2px}
.v4 .wv{flex:1;display:flex;align-items:center;gap:3px;height:38px}
.v4 .wv i{flex:1;border-radius:3px;background:linear-gradient(#7aa8ff,#2f6bff);animation:wv 1.3s ease-in-out infinite;height:30%}
.v4 .meta{display:flex;justify-content:space-between;font-size:11px;color:#8d9dc9;margin-top:10px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1000px;margin:0 auto;position:relative}
.step{border-radius:22px;border:1px solid var(--line);background:var(--glass);padding:28px;transition:border-color .3s}
.step .num{width:40px;height:40px;border-radius:50%;border:1px solid rgba(130,170,255,.45);background:rgba(47,107,255,.22);display:grid;place-items:center;font-family:var(--fh);font-weight:500;margin-bottom:18px;font-size:14px;box-shadow:0 0 22px rgba(47,107,255,.35)}
.step h3{font-size:16px;margin-bottom:6px;font-weight:700}
.step p{font-size:14px;color:var(--muted);font-weight:500}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1000px;margin:0 auto}
.price{position:relative;border-radius:22px;border:1px solid var(--line);background:var(--glass);padding:30px 26px;transition:transform .3s,border-color .3s}
.price:hover{transform:translateY(-6px)}
.price.hot{border-color:rgba(110,160,255,.65);background:linear-gradient(180deg,rgba(47,107,255,.2),rgba(255,255,255,.03));box-shadow:0 0 70px rgba(47,107,255,.3)}
.price .pt{position:absolute;top:-12px;left:24px;background:var(--grad);font-size:11px;font-weight:800;padding:4px 13px;border-radius:99px}
.price h3{font-size:14px;font-weight:700;color:#c9d6ff}
.price .amt{font-family:var(--fh);font-size:30px;font-weight:500;letter-spacing:-.04em;margin:12px 0 4px}
.price .amt small{font-family:var(--fb);font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
.price .dl{color:#8fb0ff;font-size:13px;font-weight:700}
.price ul{list-style:none;margin:20px 0 24px;display:grid;gap:10px;font-size:14px;color:#c3cfef;font-weight:500}
.price li:before{content:"✓";color:var(--cyan);font-weight:800;margin-right:10px}
.price .btn{width:100%}
.faq{max-width:720px;margin:0 auto;display:grid;gap:10px}
.faq details{border:1px solid var(--line);border-radius:16px;padding:18px 22px;background:var(--glass);transition:.25s}
.faq details[open]{border-color:rgba(130,170,255,.45);background:rgba(47,107,255,.08)}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--blue2);font-size:22px;line-height:1;transition:transform .3s}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq p{color:var(--muted);margin-top:10px;font-size:14px;font-weight:500}
.cta{position:relative;max-width:1000px;margin:0 auto;border-radius:30px;border:1px solid rgba(130,170,255,.35);padding:70px 24px;text-align:center;background:radial-gradient(520px 230px at 50% 0,rgba(47,107,255,.55),transparent),rgba(255,255,255,.025);overflow:hidden}
.cta h2{font-family:var(--fh);font-size:clamp(22px,3.4vw,36px);letter-spacing:-.035em;font-weight:500;margin-bottom:12px;line-height:1.2}
.cta p{color:var(--muted);margin-bottom:28px;font-size:15px;font-weight:500}
footer{padding:36px 0 56px;color:#5f6e98;font-size:13px;text-align:center;border-top:1px solid var(--line);font-weight:500}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:100px 20px 40px;position:relative}
.auth-box{width:100%;max-width:430px;border:1px solid rgba(130,170,255,.3);background:linear-gradient(180deg,rgba(14,26,66,.72),rgba(4,8,22,.88));border-radius:26px;padding:38px 32px;backdrop-filter:blur(18px);box-shadow:0 0 80px rgba(47,107,255,.25);animation:fu .8s both}
.auth-box h2{font-family:var(--fh);font-size:24px;letter-spacing:-.03em;font-weight:500;margin-bottom:8px}
.auth-box .sub{color:var(--muted);margin-bottom:24px;font-size:14px;font-weight:500}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#aab9e6}
.f input,.f textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:13px;font:inherit;font-size:14.5px;font-weight:500;background:rgba(255,255,255,.045);color:#fff;outline:none;transition:.2s}
.f input::placeholder,.f textarea::placeholder{color:#6b7aa6}
.f input:focus,.f textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(47,107,255,.22);background:rgba(255,255,255,.07)}
.pw{position:relative}
.pw button{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--blue2)}
.msg{padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.msg.err{background:rgba(255,80,80,.1);color:#ff9a9a;border:1px solid rgba(255,100,100,.3)}
.msg.warn{background:rgba(255,190,60,.1);color:#ffd27a;border:1px solid rgba(255,190,60,.3)}
.msg.ok{background:rgba(52,211,153,.1);color:#7be6bd;border:1px solid rgba(52,211,153,.3);animation:fu .5s}
.alt{text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted);font-weight:500}
.alt a{color:var(--blue2);font-weight:700}

/* ---------- studio ---------- */
.studio{padding:30px 0 70px;position:relative}
.st-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.st-head h2{font-family:var(--fh);font-size:24px;letter-spacing:-.03em;font-weight:500}
.quota{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:11px 16px;min-width:240px}
.quota .row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:7px;color:#b9c6ea}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .6s;box-shadow:0 0 12px rgba(61,123,255,.8)}
.st-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border-radius:22px;padding:22px;animation:fu .7s both}
.card h3{font-size:12px;margin-bottom:12px;color:#aab9e6;font-weight:800;letter-spacing:.08em}
textarea#txt{min-height:230px;resize:vertical;line-height:1.65;font-size:15.5px}
.cnt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:600;font-size:13px;color:#c3cfef;transition:.2s}
.chip:hover{border-color:var(--blue2);transform:translateY(-1px)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 0 20px rgba(47,107,255,.55)}
.voices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:420px;overflow:auto;padding:3px}
.voices::-webkit-scrollbar{width:6px}.voices::-webkit-scrollbar-thumb{background:rgba(130,170,255,.3);border-radius:9px}
.vc{padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.035);text-align:center;transition:.2s}
.vc b{display:block;font-size:13.5px;font-weight:700}
.vc small{color:var(--muted);font-size:11.5px;font-weight:600}
.vc:hover{border-color:var(--blue2);transform:translateY(-2px)}
.vc.on{border-color:rgba(120,170,255,.9);background:rgba(47,107,255,.26);box-shadow:0 0 24px rgba(47,107,255,.45)}
.gen{margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prog{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
.res{margin-top:16px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.035);margin-bottom:10px;animation:si .6s cubic-bezier(.2,.8,.2,1)}
.item p{font-size:13px;color:#c3cfef;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.item audio{width:100%;height:38px}
.item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600;gap:10px;flex-wrap:wrap}
.item a.dl{color:var(--blue2);font-weight:800}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px;font-weight:500}
.user-menu{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:#c3cfef}
.badge{background:rgba(47,107,255,.25);border:1px solid rgba(110,160,255,.4);color:#cfe0ff;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.eq{display:inline-flex;align-items:center;gap:3px;height:20px}
.eq i{width:3px;border-radius:2px;background:linear-gradient(#7aa8ff,#2f6bff);animation:wv .9s ease-in-out infinite;height:30%}

@media(max-width:900px){
  .links{display:none}
  .dash{grid-template-columns:1fr}.d-side{display:none}
  .fl{display:none}
  .bento,.steps,.plans{grid-template-columns:1fr}
  .d-two{grid-template-columns:1fr}
  .st-grid{grid-template-columns:1fr}
  .voices{grid-template-columns:repeat(2,1fr);max-height:320px}
  .user-menu .em{display:none}
  .hero{padding-top:120px}
  .d-card strong{font-size:17px}
}

/* ================= SHAXSIY KABINET (yorug' tema) ================= */
body.light{background:#f5f7fb;color:#0f172a;color-scheme:light}
body.light .aurora,body.light .spot{display:none}
body.light .msg.err{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
body.light .msg.ok{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sbk{display:none}
.sb{position:sticky;top:0;height:100vh;background:#fbfcfe;border-right:1px solid #e6e9f2;padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto;z-index:40}
.sb .logo{color:#0f172a;padding:2px 10px 16px;font-size:15px}
.ws{display:flex;align-items:center;gap:10px;border:1px solid #e3e7f0;border-radius:12px;padding:10px 12px;background:#fff;font-weight:700;font-size:13.5px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.ws i{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 40deg,#2f6bff,#7c5cff,#34e0c8,#2f6bff);flex:none}
.ni{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#4b5470;font-weight:600;font-size:14.5px;transition:.15s}
.ni svg{width:18px;height:18px;flex:none}
.ni:hover{background:#eef2fa;color:#0f172a}
.ni.on{background:#e9efff;color:#1d4ed8}
.gl{font-size:12px;color:#8b93a8;font-weight:700;padding:18px 12px 6px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid #e6e9f2}
.me .mt{flex:1;min-width:0}.me b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;color:#7b849b;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;box-shadow:0 4px 12px rgba(47,107,255,.3)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#55607a;flex:none;transition:.15s}
.ib:hover{background:#eef2fa;color:#0f172a}.ib svg{width:18px;height:18px}
.ib.dk{background:#0f172a;color:#fff;width:34px;height:34px}.ib.dk:hover{background:#1d4ed8}
.main{min-width:0;display:flex;flex-direction:column}
.tb{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #e6e9f2;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30}
.tb .mb{display:none}
.crumb{display:flex;gap:8px;align-items:center;font-size:14px;color:#6b7390;font-weight:600}
.crumb b{color:#0f172a}.crumb a:hover{color:#1d4ed8}
.flex1{flex:1}
.qpill{display:flex;align-items:center;gap:10px;border:1px solid #e3e7f0;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:700;color:#334155;background:#fff}
.qpill .qb{width:80px;height:6px;background:#edf1f8;border-radius:9px;overflow:hidden}.qpill .qb i{display:block;height:100%;background:var(--grad);transition:width .5s}
.tbb{display:flex;align-items:center;gap:7px;border:1px solid #e3e7f0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;background:#fff;color:#334155}
.tbb svg{width:16px;height:16px;color:#2f6bff}.tbb:hover{border-color:#2f6bff}
.pg{padding:32px 28px 64px;max-width:1080px;width:100%;margin:0 auto;animation:fu .4s both}
.pg h1.t{font-family:var(--fb);font-size:26px;font-weight:800;letter-spacing:-.025em;margin:0 0 6px;max-width:none;text-align:left;color:#0f172a}
.sub2{color:#6b7390;font-size:14.5px;margin-bottom:24px;font-weight:500}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lc{background:#fff;border:1px solid #e5e9f2;border-radius:18px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.btn.sm{padding:9px 16px;font-size:13px}.btn svg{width:16px;height:16px}
.btn-o{border:1px solid #dfe4ee;background:#fff;color:#0f172a}
.btn-o:hover{border-color:#2f6bff;color:#1d4ed8}
.btn-o.on{background:#eef3ff;border-color:#bcd0ff;color:#1d4ed8}
.btn-o:disabled{color:#8b93a8;cursor:default}
.spin.dk{border-color:rgba(15,23,42,.15);border-top-color:#2f6bff;display:inline-block}
.ld{display:flex;gap:10px;align-items:center;color:#6b7390;font-weight:600}
/* composer */
.cmp{padding:16px 18px 14px;transition:box-shadow .2s,border-color .2s}
.cmp:focus-within{border-color:#bcd0ff;box-shadow:0 0 0 4px rgba(47,107,255,.08),0 10px 30px rgba(15,23,42,.06)}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.ctabs>*{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;color:#55607a}
.ctabs>* svg{width:15px;height:15px}.ctabs .on{background:#f0f3fa;color:#0f172a}.ctabs a:hover{background:#f5f7fb;color:#0f172a}
.cmp textarea{width:100%;min-height:170px;border:0;outline:0;resize:vertical;font:inherit;font-size:16.5px;line-height:1.65;color:#0f172a;background:none;padding:10px 4px}
.cmp textarea::placeholder,.big::placeholder{color:#9aa2b6}
.cbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px}
.pick{display:flex;align-items:center;gap:8px;border:1px solid #e3e7f0;border-radius:11px;padding:8px 12px;font-size:13.5px;background:#fff;max-width:100%}
.pick b{font-weight:800}.pick span{color:#7b849b;font-weight:600}.pick svg{width:15px;height:15px;color:#7b849b}
.pick:hover,.selw:hover{border-color:#2f6bff}
.selw{display:flex;align-items:center;gap:6px;border:1px solid #e3e7f0;border-radius:11px;padding:0 10px;background:#fff}
.selw svg{width:15px;height:15px;color:#7b849b}
.selw select,.sel2 select{border:0;outline:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:#0f172a;padding:9px 2px;cursor:pointer;appearance:none;-webkit-appearance:none}
.cnt2{font-size:12.5px;color:#7b849b;font-weight:600}.cnt2 b{color:#0f172a}.cnt2 b.bad{color:#dc2626}
.prog2{font-size:13px;color:#55607a;font-weight:600;display:flex;align-items:center;gap:8px}
.prog2:empty{display:none}
.vav{display:inline-block;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 2px 6px rgba(15,23,42,.12)}
/* banner */
.bn{position:relative;overflow:hidden;margin:22px 0 8px;border-radius:20px;padding:48px 24px;text-align:center;color:#fff;background:linear-gradient(120deg,#0b1f6b,#1d4ed8,#2563eb,#0ea5e9,#1d4ed8);background-size:300% 300%;animation:bgm 12s ease infinite}
@keyframes bgm{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.bn h2{font-family:var(--fh);font-weight:500;font-size:clamp(20px,3vw,30px);letter-spacing:-.03em;position:relative}
.bn p{opacity:.85;margin:8px 0 20px;font-weight:500;position:relative}
.bn>div:last-child{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative}
.bw{background:#fff;color:#0f172a}.bw:hover{transform:translateY(-2px)}
.bt{color:#fff;border:1px solid rgba(255,255,255,.4)}.bt:hover{background:rgba(255,255,255,.12)}
.bnw{position:absolute;inset:auto 0 0 0;height:70%;display:flex;align-items:flex-end;gap:5px;padding:0 10px;opacity:.18}
.bnw i{flex:1;border-radius:4px 4px 0 0;background:#fff;animation:wv 1.6s ease-in-out infinite;height:30%}
.sech{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.sech h3{font-size:16px;font-weight:800}.sech a{display:flex;gap:4px;align-items:center;font-size:13px;font-weight:700;color:#1d4ed8}.sech a svg{width:14px}
/* history list */
.hl{padding:6px}
.hi{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;animation:si .5s both}
.hi+.hi{border-top:1px solid #eef1f6}
.hi:hover{background:#fafbfe}
.hm{flex:1;min-width:0}
.hm p{font-size:14px;font-weight:600;color:#1e293b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hm small{display:block;color:#7b849b;font-size:12px;font-weight:600;margin:3px 0 8px}
.hm audio{width:100%;height:36px}
.emp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:40px 16px;color:#7b849b;text-align:center;font-size:13.5px}
.emp svg{width:30px;height:30px;color:#b4bccd;margin-bottom:6px}.emp b{color:#1e293b}
.emp.sm{padding:20px}
.res2{margin-top:16px;padding:16px;border-radius:16px;border:1px solid #cfe0ff;background:linear-gradient(180deg,#f3f7ff,#fff);animation:si .5s both}
.rh{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.rh>div{flex:1}.rh b{display:block}.rh small{color:#6b7390;font-weight:600}
.res2 audio{width:100%}
#out .msg{margin-top:14px}
/* TTS */
.tts{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 64px)}
.ed{display:flex;flex-direction:column;padding:30px 40px 20px;min-width:0}
.big{flex:1;min-height:300px;border:0;outline:0;resize:none;font:inherit;font-size:18px;line-height:1.7;color:#0f172a;background:none}
.starters{margin-top:16px}.starters small{display:block;color:#7b849b;font-weight:700;font-size:12.5px;margin-bottom:10px}
.starters>div{display:flex;flex-wrap:wrap;gap:8px}
.stc{border:1px solid #e3e7f0;background:#fff;border-radius:10px;padding:8px 13px;font-size:13.5px;font-weight:600;color:#334155;transition:.15s}
.stc:hover{border-color:#2f6bff;color:#1d4ed8;transform:translateY(-1px)}
.edbar{position:sticky;bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:14px 0 6px;background:linear-gradient(180deg,rgba(245,247,251,0),#f5f7fb 30%)}
.rp{background:#fff;border-left:1px solid #e6e9f2;padding:20px 22px 30px;overflow:auto}
.tabs{display:flex;gap:18px;border-bottom:1px solid #e6e9f2;margin-bottom:8px}
.tabs button{padding:8px 0 12px;font-weight:700;font-size:14px;color:#7b849b;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:#0f172a;border-color:#0f172a}
.lb{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:#1e293b;margin:18px 0 8px}
.lb em{font-style:normal;color:#1d4ed8;font-size:12.5px}
.fbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid #e3e7f0;border-radius:12px;padding:11px 13px;background:#fff;font-size:14px;text-align:left;color:#0f172a;transition:.15s}
.fbtn>span:not(.vav){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#55607a}.fbtn b{color:#0f172a}

/* ---- Audio: base64 -> PCM -> WAV ---- */
function b64ToBytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function extractPcm(bytes, mime){
  let rate = 24000;
  const m = /rate=(\d+)/i.exec(mime||""); if(m) rate = +m[1];
  const tag = i => String.fromCharCode(bytes[i],bytes[i+1],bytes[i+2],bytes[i+3]);
  if(bytes.length>44 && tag(0)==="RIFF"){
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let p = 12;
    while(p+8 <= bytes.length){
      const id = tag(p), size = dv.getUint32(p+4,true);
      if(id==="fmt ") rate = dv.getUint32(p+12,true);
      if(id==="data"){
        const end = (size===0 || size===0xFFFFFFFF || p+8+size>bytes.length) ? bytes.length : p+8+size;
        return {pcm: bytes.subarray(p+8,end), rate};
      }
      if(size===0xFFFFFFFF) break;
      p += 8 + size + (size&1);
    }
    return {pcm: bytes.subarray(44), rate};
  }
  return {pcm: bytes, rate};
}
function buildWav(chunks, rate){
  let total = 0; chunks.forEach(c => total += c.length);
  total -= total % 2;
  const out = new Uint8Array(44 + total), dv = new DataView(out.buffer);
  const w = (o,s) => { for(let i=0;i<s.length;i++) out[o+i]=s.charCodeAt(i); };
  w(0,"RIFF"); dv.setUint32(4,36+total,true); w(8,"WAVE"); w(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,rate,true); dv.setUint32(28,rate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,"data"); dv.setUint32(40,total,true);
  let off = 44;
  for(const c of chunks){ const n = Math.min(c.length, 44+total-off); out.set(c.subarray(0,n), off); off += n; if(off>=44+total) break; }
  return {blob: new Blob([out],{type:"audio/wav"}), seconds: total/2/rate};
}

/* ---- Matnni bo'laklash ---- */
function splitText(text, max){
  const parts = text.replace(/\r/g,"").match(/[^.!?…\n]+[.!?…]*\s*/g) || [text];
  const out = []; let cur = "";
  const push = () => { if(cur.trim()) out.push(cur.trim()); cur=""; };
  for(let s of parts){
    while(s.length > max){
      let cut = s.lastIndexOf(" ", max); if(cut < max*0.5) cut = max;
      if(cur) push();
      out.push(s.slice(0,cut).trim()); s = s.slice(cut);
    }
    if((cur+s).length > max) push();
    cur += s;
  }
  push();
  return out;
}

function setupReveal(){
  const els = document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12, rootMargin:"0px 0px -40px 0px"});
  els.forEach(e=>io.observe(e));
}

function typeLoop(el, lines){
  let li = 0, ci = 0, del = false;
  const step = () => {
    if(!el.isConnected) return;
    const full = lines[li];
    if(!del){ ci++; el.textContent = full.slice(0,ci); if(ci>=full.length){ del=true; later(step, 1800); return; } later(step, 38+Math.random()*40); }
    else { ci -= 2; if(ci<=0){ ci=0; del=false; li=(li+1)%lines.length; el.textContent=""; later(step, 400); return; } el.textContent = full.slice(0,ci); later(step, 16); }
  };
  step();
}

function countUp(el, to, ms=1400){
  const t0 = performance.now();
  const f = t => { const p = Math.min(1,(t-t0)/ms), e = 1-Math.pow(1-p,3); el.textContent = fmt(Math.round(to*e)); if(p<1 && el.isConnected) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

  });

    let k = 0; every(()=>{ k++; const sp=o.children; [...sp].forEach(s=>s.classList.remove("on")); sp[k%2].classList.add("on"); }, 1800);

  if(s <= 0.8) p.push("speaking slowly"); else if(s < 0.95) p.push("speaking a little slowly");
  else if(s >= 1.2) p.push("speaking quickly"); else if(s > 1.05) p.push("speaking a little faster");
  if(SEL.lang) p.push("in " + SEL.lang);
  return p.join(", ").slice(0, 160);
}

/* ---- Ovoz yaratish ---- */
async function generate(text, prog){
  text = text.trim();
  if(!text) return {ok:false, error:"Avval matn kiriting"};
  const left = USER.limit - USER.used;
  if(text.length > left) return {ok:false, error:`Bugungi qolgan limit: ${fmt(left)} belgi. Matnni qisqartiring yoki tarifni oshiring.`};
  const parts = splitText(text, CONFIG.MAX_CHUNK), style = buildStyle(), voice = SEL.voice;
  const pcms = []; let rate = 24000;
  for(let i=0;i<parts.length;i++){
    prog && prog(parts.length>1 ? `Bo'lak ${i+1} / ${parts.length}...` : "Ovoz tayyorlanmoqda...");
    const r = await api("tts", {text: parts[i], voice, style});
    if(!r.ok){
      if(r.error==="auth"){ store.token=""; USER=null; location.hash="#/login"; return {ok:false, error:""}; }
      if(r.error==="limit"){ setQuota(r.used, r.limit); return {ok:false, error:r.message}; }
      return {ok:false, error:r.error||"Ovoz yaratilmadi"};
    }
    const {pcm, rate:rt} = extractPcm(b64ToBytes(r.audio), r.mime); rate = rt;
    if(i>0) pcms.push(new Uint8Array(Math.round(rate*0.18)*2));
    pcms.push(pcm);
    setQuota(r.used, r.limit);
  }
  const {blob, seconds} = buildWav(pcms, rate);
  const item = {text, voice, style: SEL.styleName||"Tabiiy", url: URL.createObjectURL(blob), seconds, time: new Date()};
  HISTORY.unshift(item);
  if(HISTORY.length > 20){ const o = HISTORY.pop(); URL.revokeObjectURL(o.url); }
  return {ok:true, item};
}

function wireGen(){
  const txt = $("#txt"), go = $("#go"), cc = $("#cc"), out = $("#out"), pg = $("#pg");
  try{ const d = sessionStorage.getItem("ovoz_draft"); if(d && !txt.value) txt.value = d; }catch(e){}
  const upd = () => {
    const n = txt.value.length, left = Math.max(0, USER.limit - USER.used);
    cc.innerHTML = `<b class="${n>left?"bad":""}">${fmt(n)}</b> / ${fmt(left)} belgi`;
  };
  txt.addEventListener("input", () => { upd(); try{ sessionStorage.setItem("ovoz_draft", txt.value); }catch(e){} });
  upd();
  go.onclick = async () => {
    out.innerHTML = "";
    go.disabled = true; const old = go.innerHTML; go.innerHTML = '<span class="spin"></span> Yaratilmoqda...';
    const r = await generate(txt.value, t => { if(pg) pg.innerHTML = `<span class="eq">${eqBars(7,.1)}</span>${t}`; });
    go.disabled = false; go.innerHTML = old; if(pg) pg.textContent = "";
    if(!r.ok){ if(r.error) out.innerHTML = `<div class="msg err">${esc(r.error)}</div>`; return; }
    out.innerHTML = resultHTML(r.item); upd();
    const rec = $("#recent"); if(rec) rec.innerHTML = histList(4);
    const th = $("#tabH"); if(th) th.innerHTML = histList();
    const a = out.querySelector("audio"); if(a) a.play().catch(()=>{});
  };
  return upd;
}

function openPicker(onPick){
  const m = document.createElement("div"); m.className = "md";
  m.innerHTML = `<div class="mdb"><div class="mdh"><b>Ovoz tanlang</b><button class="x" aria-label="Yopish">✕</button></div>
    <div class="srch">${IC.search}<input placeholder="Ovoz yoki uslub qidirish..." id="mq"></div><div class="ml" id="ml"></div></div>`;
  document.body.append(m);

  const draw = () => {
    const s = q.value.toLowerCase();
    ml.innerHTML = VOICES.filter(v => (v[0]+" "+v[1]).toLowerCase().includes(s)).map(v =>
      `<button class="mi ${v[0]===SEL.voice?"on":""}" data-v="${v[0]}">${vav(v[0],36)}<span><b>${v[0]}</b><small>${v[1]}</small></span>${v[0]===SEL.voice?IC.check:""}</button>`).join("")
      || `<div class="emp sm">Topilmadi</div>`;

  draw(); q.oninput = draw; setTimeout(()=>q.focus(), 60);

  document.addEventListener("keydown", esc_);

    if(b){ SEL.voice = b.dataset.v; saveSel(); close(); toast(`${SEL.voice} ovozi tanlandi`); onPick && onPick(); }

function setPlayBtns(){
  document.querySelectorAll("[data-play]").forEach(b => {
    const on = PLAYER && PLAYER._v===b.dataset.play && !PLAYER.paused;
    b.innerHTML = on ? IC.stop : IC.play; b.classList.toggle("on", on);
  });
}
async function playSample(name, btn){
  if(PLAYER && PLAYER._v===name && !PLAYER.paused){ PLAYER.pause(); return; }
  if(PLAYER) PLAYER.pause();
  if(!SAMPLES[name]){
    btn.innerHTML = '<span class="spin dk"></span>';
    const r = await api("tts", {text:`Assalomu alaykum! Men ${name}. Matningizni shu ovozda o'qib beraman.`, voice:name, style:""});
    if(!r.ok){
      setPlayBtns();
      if(r.error==="limit"){ setQuota(r.used, r.limit); toast(r.message); } else toast(r.error==="auth"?"Qayta kiring":(r.error||"Namuna yaratilmadi"));
      return;
    }
    setQuota(r.used, r.limit);
    const {pcm, rate} = extractPcm(b64ToBytes(r.audio), r.mime);
    SAMPLES[name] = URL.createObjectURL(buildWav([pcm], rate).blob);
  }
  PLAYER = new Audio(SAMPLES[name]); PLAYER._v = name;
  PLAYER.onended = PLAYER.onpause = PLAYER.onplay = setPlayBtns;
  PLAYER.play().catch(()=>{});
}

          <button class="ib dk" id="cp" title="Nusxalash">${IC.copy}</button><button class="ib dk" id="sh" title="Ulashish">${IC.share}</button></div>
      </div>
      <div class="st4"><div><small>Taklif qilinganlar</small><b>${fmt(u.invited||0)}</b></div>
        <div><small>Bonus</small><b>+${fmt(u.bonus||0)}</b></div>
        <div><small>Kunlik limit</small><b>${fmt(u.limit)}</b></div>
        <div><small>Qolgan takliflar</small><b>${Math.max(0,(u.refMax||10)-(u.invited||0))}</b></div></div>
    </div></div>`;
    const copy = async () => {
      try{ await navigator.clipboard.writeText(link); }
      catch(e){ const r = document.createRange(); r.selectNode($("#rl")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
      toast("Havola nusxalandi ✓");
    };
    $("#cp").onclick = () => link && copy();
    $("#sh").onclick = () => {
      if(!link) return;
      const text = `${CONFIG.BRAND} — matnni tabiiy ovozga aylantiradi. Shu havola orqali bepul ro'yxatdan o'ting:`;
      if(navigator.share) navigator.share({title:CONFIG.BRAND, text, url:link}).catch(()=>{});
      else window.open("https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent(text), "_blank");
    };
  }
};

/* ============================================================
   Router
   ============================================================ */
function route(){
  clearTimers();
  const raw = (location.hash||"#/").replace(/^#/,"") || "/";
  const [h, qs] = raw.split("?");
  const ref = new URLSearchParams(qs||"").get("ref") || new URLSearchParams(location.search).get("ref");
  if(ref){ try{ localStorage.setItem("ovoz_ref", ref); }catch(e){} }
  const isApp = h.startsWith("/app") || h==="/studio";
  document.body.classList.toggle("light", isApp);
  window.scrollTo(0,0);
  const app = $("#app");
  if(isApp){
    if(!store.token){ location.hash="#/login"; return; }
    const page = h.split("/")[2] || "home";
    renderApp(PAGES[page] ? page : "home"); return;
  }
  if(h==="/login" || h==="/register"){
    if(store.token){ location.hash="#/app"; return; }
    const mode = h.slice(1);
    app.innerHTML = authPage(mode); bindNav(); bindAuth(mode); return;
  }
  app.innerHTML = landing(); bindNav(); bindLanding(); bindFx();
}
window.addEventListener("hashchange", route);
route();

</script>
