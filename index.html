<style>
:root{
  --bg:#03050f; --ink:#eef2ff; --muted:#8e9cc7; --blue:#2f6bff; --blue2:#5b8cff; --cyan:#34e0c8; --violet:#8b5cff;
  --glass:rgba(255,255,255,.045); --line:rgba(130,165,255,.18);
  --ok:#34d399; --err:#ff6b6b;
  --grad:linear-gradient(135deg,#2358ff 0%,#4a7dff 55%,#7aa8ff 100%);
  --fh:'Unbounded','Manrope',system-ui,sans-serif;
  --fb:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;color-scheme:dark}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{position:relative;z-index:2}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}

/* ---------- jonli fon ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;will-change:transform}
.aurora i:nth-child(1){width:520px;height:520px;background:#2f6bff;left:-8%;top:8%;animation:dr1 22s ease-in-out infinite}
.aurora i:nth-child(2){width:460px;height:460px;background:#7b4dff;right:-6%;top:30%;animation:dr2 26s ease-in-out infinite}
.aurora i:nth-child(3){width:420px;height:420px;background:#12c8b4;left:30%;bottom:-12%;animation:dr3 30s ease-in-out infinite;opacity:.22}
@keyframes dr1{0%,100%{transform:translate(0,0)}50%{transform:translate(160px,120px)}}
@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-180px,-90px)}}
@keyframes dr3{0%,100%{transform:translate(0,0)}50%{transform:translate(140px,-120px)}}
.spot{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),rgba(110,160,255,.13),transparent 65%)}

/* ---------- nav ---------- */
.nav{position:absolute;top:0;left:0;right:0;z-index:50}
.nav.fix{position:sticky;background:rgba(3,5,15,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:500;font-size:16px;letter-spacing:-.01em}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px rgba(47,107,255,.6)}
.logo i svg{width:19px;height:19px}
.links{display:flex;gap:4px;padding:5px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);font-size:13px;font-weight:600;color:#b9c6ea}
.links a{padding:8px 17px;border-radius:99px;transition:.2s}
.links a:hover{color:#fff;background:rgba(255,255,255,.09)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:99px;font-weight:700;font-size:14px;transition:.25s;white-space:nowrap}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 8px 28px rgba(47,107,255,.5)}
.btn-p:before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:.6s}
.btn-p:hover:before{left:130%}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 14px 38px rgba(47,107,255,.7)}
.btn-p:disabled{opacity:.6;transform:none;cursor:wait}
.btn-g{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#dbe5ff}
.btn-g:hover{border-color:var(--blue2);color:#fff}
.btn-lg{padding:16px 32px;font-size:15px}

/* ---------- hero ---------- */
.hero{position:relative;padding:150px 0 0;text-align:center}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stars span{position:absolute;border-radius:50%;background:#9db8ff;opacity:.5;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.95;transform:scale(1.2)}}
.shoot{position:absolute;top:12%;left:70%;width:110px;height:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(215deg);opacity:0;animation:sh 7s ease-in infinite 2s}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(215deg)}4%{opacity:1}14%{opacity:0;transform:translate(-340px,230px) rotate(215deg)}100%{opacity:0}}
.beam{position:absolute;left:50%;top:0;transform:translateX(-50%);width:300px;height:720px;background:linear-gradient(180deg,rgba(60,120,255,0),rgba(70,130,255,.9) 52%,rgba(60,120,255,0));filter:blur(46px);animation:bm 5s ease-in-out infinite;pointer-events:none}
@keyframes bm{0%,100%{opacity:.55;width:260px}50%{opacity:.95;width:360px}}
.beam:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:linear-gradient(180deg,transparent,#d6e4ff 55%,transparent)}
.hero .wrap{position:relative}
.tag{display:inline-flex;align-items:center;gap:9px;padding:8px 17px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);font-size:12.5px;font-weight:600;color:#d3deff}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(52,224,200,.7);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(52,224,200,0)}100%{box-shadow:0 0 0 0 rgba(52,224,200,0)}}
.tag svg{width:14px;height:14px}
h1{font-family:var(--fh);font-size:clamp(28px,4.7vw,58px);line-height:1.14;letter-spacing:-.035em;font-weight:500;margin:26px auto 22px;max-width:960px}
.w{display:inline-block;margin:0 .13em;opacity:0;transform:translateY(34px);filter:blur(10px);animation:wi .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.1s + .15s);background:linear-gradient(180deg,#fff 30%,#a9bcf5);-webkit-background-clip:text;background-clip:text;color:transparent}
.w.hl{background:linear-gradient(90deg,#5b8cff,#34e0c8,#8b5cff,#5b8cff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:wi .95s cubic-bezier(.2,.7,.2,1) forwards,sf 6s linear infinite;animation-delay:calc(var(--i)*.1s + .15s),0s}
@keyframes wi{to{opacity:1;transform:none;filter:none}}
@keyframes sf{to{background-position:300% 0}}
.lead{font-size:clamp(14.5px,1.8vw,17px);color:var(--muted);max-width:540px;margin:0 auto 34px;font-weight:500;opacity:0;animation:fu .9s .7s forwards}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero-form{display:flex;align-items:center;gap:8px;max-width:530px;margin:0 auto;padding:7px 7px 7px 22px;border-radius:99px;border:1px solid rgba(130,170,255,.4);background:rgba(8,16,40,.6);backdrop-filter:blur(14px);box-shadow:0 0 44px rgba(47,107,255,.3);opacity:0;animation:fu .9s .9s forwards}
.hero-form svg{width:20px;height:20px;flex:none;color:#9db3f0}
.hero-form input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14.5px;padding:10px 4px}
.hero-form input::placeholder{color:#8493bd}
.hero-form .pre{font-weight:700;color:#b9c6ea;font-size:14.5px;margin-left:-2px}
.phf{display:flex;align-items:center;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);transition:.2s}
.phf:focus-within{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(47,107,255,.22);background:rgba(255,255,255,.07)}
.phf span{padding:0 0 0 16px;font-weight:700;color:#aab9e6;font-size:14.5px}
.phf input{border:0!important;background:none!important;box-shadow:none!important;padding-left:8px!important;letter-spacing:.02em}
.proof{margin-top:18px;font-size:12.5px;color:#7f8fba;font-weight:600;opacity:0;animation:fu .9s 1.1s forwards}

/* ---------- jonli dashboard ---------- */
.dashwrap{position:relative;max-width:1000px;margin:70px auto 0;perspective:1500px;opacity:0;animation:fu 1.1s 1.2s forwards}
.dash{position:relative;border-radius:22px;border:1px solid rgba(130,170,255,.32);background:linear-gradient(180deg,rgba(14,26,66,.86),rgba(4,8,22,.94));box-shadow:0 0 90px rgba(47,107,255,.32),0 1px 0 rgba(255,255,255,.14) inset;display:grid;grid-template-columns:170px 1fr;text-align:left;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 66%,transparent 100%);mask-image:linear-gradient(180deg,#000 66%,transparent 100%);padding:12px;gap:12px;transition:transform .25s ease-out;transform-style:preserve-3d}
.d-side{border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:14px 10px;min-height:430px}
.d-side .logo{font-size:11px;padding:2px 6px 16px}
.d-side .logo i{width:22px;height:22px;border-radius:7px}.d-side .logo i svg{width:12px;height:12px}
.d-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:11.5px;font-weight:600;color:#98a8d6;margin-bottom:3px}
.d-item.on{background:rgba(47,107,255,.24);color:#fff;border:1px solid rgba(110,160,255,.4)}
.d-item b{width:10px;height:10px;border-radius:3px;border:1.5px solid currentColor;opacity:.8}
.d-main{display:grid;gap:12px;align-content:start;min-width:0}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;border:1px solid rgba(110,160,255,.3);background:rgba(255,255,255,.04);font-size:12px;color:#d6e0ff;min-height:46px}
.d-top .ty{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-top .ty:before{content:"✦ ";color:var(--blue2)}
.d-top .ty u{display:inline-block;width:2px;height:13px;background:#8fb0ff;margin-left:2px;vertical-align:-2px;animation:bk 1s steps(2) infinite}
@keyframes bk{50%{opacity:0}}
.d-top .gb{flex:none;font-size:11px;font-weight:700;padding:8px 16px;border-radius:9px;background:var(--grad);box-shadow:0 0 18px rgba(47,107,255,.6);animation:gp 2.4s ease-in-out infinite}
@keyframes gp{50%{box-shadow:0 0 30px rgba(80,140,255,.95);transform:scale(1.04)}}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.d-card{border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(47,107,255,.22),rgba(255,255,255,.03));padding:14px}
.d-card small{display:block;color:#8d9dc9;font-size:10.5px;margin-top:20px;font-weight:600}
.d-card strong{font-family:var(--fh);font-size:22px;font-weight:500;letter-spacing:-.04em}
.d-card .mini{float:right;font-size:9.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:#b9c6ea}
.d-two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.d-panel{border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:14px;min-width:0;overflow:hidden}
.d-panel h6{font-size:12px;font-weight:700;margin-bottom:2px}
.d-panel p{font-size:10px;color:#7f8fba;margin-bottom:12px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:135px}
.bars i{flex:1;border-radius:4px;background:rgba(255,255,255,.11);transition:height 1s cubic-bezier(.3,.8,.3,1),background .6s;position:relative;transform-origin:bottom;animation:gr 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes gr{from{transform:scaleY(0)}}
.bars i.hl{background:linear-gradient(180deg,#4a85ff,#1c43c9);box-shadow:0 0 20px rgba(61,123,255,.75)}
.bars i.hl:after{content:attr(data-v) " audio";position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:9px;font-style:normal;white-space:nowrap;background:#2f6bff;padding:3px 8px;border-radius:5px;font-weight:700}
.act{display:grid;gap:9px}
.act div{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#a9b7df;font-weight:600;animation:si .6s cubic-bezier(.2,.8,.2,1)}
@keyframes si{from{opacity:0;transform:translateX(-18px)}}
.act div span:first-child{display:flex;align-items:center;gap:8px}
.act div span:first-child:before{content:"";width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#34e0c8);flex:none}
.act div span:last-child{color:#6f7fa9}
.fl{position:absolute;z-index:5;display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:15px;border:1px solid rgba(140,175,255,.4);background:rgba(10,18,48,.82);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(47,107,255,.25);font-size:12px;animation:fy 6s ease-in-out infinite}
.fl b{display:block;font-size:12.5px;font-weight:700}
.fl small{color:#92a3d6;font-weight:600;font-size:11px}
.fl .fi{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;flex:none;box-shadow:0 0 16px rgba(47,107,255,.7)}
.fl .ck{width:30px;height:30px;border-radius:50%;background:rgba(52,211,153,.2);color:var(--ok);display:grid;place-items:center;font-weight:800;flex:none}
.fl1{left:-48px;top:150px}.fl2{right:-40px;top:300px;animation-delay:-3s}.fl3{left:-30px;top:380px;animation-delay:-1.5s}
@keyframes fy{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mw{display:flex;align-items:center;gap:2px;height:22px}
.mw i{width:3px;border-radius:2px;background:linear-gradient(#7aa8ff,#2f6bff);animation:wv 1.1s ease-in-out infinite;height:30%}
@keyframes wv{0%,100%{height:15%}50%{height:100%}}

/* ---------- marquee ---------- */
.uses{padding:60px 0 10px;text-align:center;overflow:hidden}
.uses p{font-size:12px;color:#7b8ab4;margin-bottom:24px;letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.mq{display:flex;width:max-content;animation:mq 28s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.uses{-webkit-mask-image:none}
.mq-wrap{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq{-webkit-mask-image:none}
.mq span{display:flex;align-items:center;gap:10px;margin:0 28px;font-family:var(--fh);font-weight:500;font-size:15px;color:#6f7eaa;white-space:nowrap}
.mq span:before{content:"✦";color:var(--blue2)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
section{padding:90px 0;position:relative}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.sec-h{text-align:center;max-width:720px;margin:0 auto 48px}
.sec-h .tag{margin-bottom:22px}
.sec-h h2{font-family:var(--fh);font-size:clamp(24px,3.6vw,40px);letter-spacing:-.035em;line-height:1.18;font-weight:500;color:#fff}
.sec-h h2 span{background:linear-gradient(90deg,#6c9aff,#34e0c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-h p{color:var(--muted);margin-top:14px;font-size:15px;font-weight:500}
.sp{position:relative}
.sp:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(300px circle at var(--x,50%) var(--y,0%),rgba(100,150,255,.24),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.sp:hover:before{opacity:1}
.sp:hover{border-color:rgba(130,170,255,.5)!important}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1000px;margin:0 auto}
.bcard{border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.018));padding:28px 28px 0;overflow:hidden;min-height:350px;display:flex;flex-direction:column;transition:border-color .3s}
.bcard h3{font-family:var(--fh);font-size:15px;font-weight:500;margin-bottom:8px}
.bcard p{font-size:14px;color:var(--muted);max-width:350px;font-weight:500}
.bvis{margin-top:auto;position:relative;height:195px}
.v1 .box{position:absolute;left:0;right:30px;bottom:-1px;border-radius:14px 14px 0 0;border:1px solid var(--line);background:rgba(6,12,32,.92);padding:14px}
.v1 .in{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#cfdbff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:rgba(255,255,255,.04);font-weight:600}
.v1 .in u{width:2px;height:12px;background:#8fb0ff;animation:bk 1s steps(2) infinite}
.v1 .in b{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;color:#fff}
.v1 .opt{margin-top:8px;font-size:11.5px;color:#b9c6ea;display:grid;gap:5px;font-weight:600}
.v1 .opt span{padding:7px 10px;border-radius:8px;transition:.4s;border:1px solid transparent}
.v1 .opt span.on{background:rgba(47,107,255,.28);border-color:rgba(110,160,255,.4);color:#fff}

.v4 .meta{display:flex;justify-content:space-between;font-size:11px;color:#8d9dc9;margin-top:10px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1000px;margin:0 auto;position:relative}

.price{position:relative;border-radius:22px;border:1px solid var(--line);background:var(--glass);padding:30px 26px;transition:transform .3s,border-color .3s}
.price:hover{transform:translateY(-6px)}
.price.hot{border-color:rgba(110,160,255,.65);background:linear-gradient(180deg,rgba(47,107,255,.2),rgba(255,255,255,.03));box-shadow:0 0 70px rgba(47,107,255,.3)}

.price .dl{color:#8fb0ff;font-size:13px;font-weight:700}
.price ul{list-style:none;margin:20px 0 24px;display:grid;gap:10px;font-size:14px;color:#c3cfef;font-weight:500}
.price li:before{content:"✓";color:var(--cyan);font-weight:800;margin-right:10px}
.price .btn{width:100%}
.faq{max-width:720px;margin:0 auto;display:grid;gap:10px}
.faq details{border:1px solid var(--line);border-radius:16px;padding:18px 22px;background:var(--glass);transition:.25s}

.faq p{color:var(--muted);margin-top:10px;font-size:14px;font-weight:500}
.studio4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px;margin:0 auto}

.sc4{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:24px;border:1px solid rgba(140,170,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));color:inherit;text-decoration:none;transition:.25s}
.sc4:hover{transform:translateY(-4px);border-color:rgba(140,170,255,.45);box-shadow:0 20px 50px rgba(0,0,0,.35)}

.sc4 h3{font-family:var(--fh);font-weight:500;font-size:19px;letter-spacing:-.02em;margin-top:6px}.sc4 p{color:var(--muted);font-size:14.5px;line-height:1.55;font-weight:500;flex:1}
.go4{font-weight:800;font-size:13.5px;color:#9cc0ff}
.sec-p{color:var(--muted);font-weight:600;margin-top:12px;font-size:16px}
.ai2{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center;max-width:1080px;margin:0 auto}
.ai2 h2{font-family:var(--fh);font-size:clamp(26px,3.6vw,42px);letter-spacing:-.035em;line-height:1.15;font-weight:500;margin:18px 0 14px}
.ai2 h2 span{background:linear-gradient(90deg,#ff9a62,#8b7bff 45%,#6c9aff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ai2>div>p{color:var(--muted);font-weight:500;font-size:15.5px;line-height:1.6}
.ai2 ul{list-style:none;display:grid;gap:12px;margin:22px 0 28px}
.ai2 li{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:14.5px;color:#dbe4ff}
.ai2 li i{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:13px;background:linear-gradient(135deg,rgba(255,138,76,.25),rgba(124,92,255,.3));border:1px solid rgba(255,255,255,.12)}
.ai2 .note2{display:block;margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:600}
.aichat{position:relative;border-radius:26px;border:1px solid rgba(150,170,255,.28);background:linear-gradient(180deg,rgba(20,28,70,.75),rgba(6,10,28,.85));padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 70px rgba(124,92,255,.22);overflow:hidden}
.aichat:before{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(closest-side,rgba(255,138,76,.18),transparent);pointer-events:none}
.ac-top{display:flex;align-items:center;gap:10px;padding:2px 4px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px;font-weight:700;font-size:13.5px}
.ac-top .av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a4c,#7c5cff);font-size:15px;color:#fff}
.ac-top small{margin-left:auto;display:flex;align-items:center;gap:6px;color:#9fb0dd;font-weight:600;font-size:12px}
.ac-top small b{width:7px;height:7px;border-radius:50%;background:#34e0a0;box-shadow:0 0 8px #34e0a0}
.acm{display:flex;flex-direction:column;gap:10px;min-height:300px}
.acm>*{opacity:0;transform:translateY(10px);animation:acin 12s infinite}
.acu{align-self:flex-end;max-width:82%;background:var(--grad);color:#fff;padding:11px 14px;border-radius:16px 16px 4px 16px;font-size:13.5px;font-weight:600;animation-delay:.2s}
.aca{max-width:88%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:11px 14px;border-radius:16px 16px 16px 4px;font-size:13.5px;color:#dbe4ff;font-weight:500;line-height:1.5}
.aca.a1{animation-delay:1.4s}.aca.a2{animation-delay:4.6s}
.actool{display:flex;align-items:center;gap:10px;align-self:flex-start;padding:9px 12px;border-radius:12px;border:1px solid rgba(130,170,255,.3);background:rgba(47,107,255,.1);font-size:12.5px;font-weight:700;color:#cfe0ff;animation-delay:2.6s}
.actool .tl{width:22px;height:22px;border-radius:7px;background:var(--grad);display:grid;place-items:center}.actool .tl svg{width:13px;height:13px;color:#fff}
.actool em{font-style:normal;color:#8ea2d6;font-weight:600}
.actool .ok{margin-left:4px;color:#34e0a0;opacity:0;animation:acok 12s infinite;animation-delay:3.8s}
.acaud{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(47,107,255,.2),rgba(124,92,255,.14));border:1px solid rgba(130,170,255,.3);animation-delay:3.9s}
.acaud .pb{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.acaud .pb svg{width:14px;height:14px;fill:#2f6bff;margin-left:2px}
.acaud .eq{flex:1;height:26px;gap:2px;overflow:hidden}.acaud .eq i{flex:1;width:auto}
.acaud span{font-size:12px;color:#c3d0f5;font-weight:700;white-space:nowrap}
@keyframes acin{0%{opacity:0;transform:translateY(10px)}6%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes acok{0%,2%{opacity:0}8%,88%{opacity:1}96%,100%{opacity:0}}
@media(max-width:900px){.ai2{grid-template-columns:1fr;gap:30px}}
@media(prefers-reduced-motion:reduce){.acm>*,.actool .ok{animation:none;opacity:1;transform:none}}
.cta{position:relative;max-width:1000px;margin:0 auto;border-radius:30px;border:1px solid rgba(130,170,255,.35);padding:70px 24px;text-align:center;background:radial-gradient(520px 230px at 50% 0,rgba(47,107,255,.55),transparent),rgba(255,255,255,.025);overflow:hidden}
.cta h2{font-family:var(--fh);font-size:clamp(22px,3.4vw,36px);letter-spacing:-.035em;font-weight:500;margin-bottom:12px;line-height:1.2}
.cta p{color:var(--muted);margin-bottom:28px;font-size:15px;font-weight:500}
footer{padding:36px 0 56px;color:#5f6e98;font-size:13px;text-align:center;border-top:1px solid var(--line);font-weight:500}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:100px 20px 40px;position:relative}
.auth-box{width:100%;max-width:430px;border:1px solid rgba(130,170,255,.3);background:linear-gradient(180deg,rgba(14,26,66,.72),rgba(4,8,22,.88));border-radius:26px;padding:38px 32px;backdrop-filter:blur(18px);box-shadow:0 0 80px rgba(47,107,255,.25);animation:fu .8s both}
.auth-box h2{font-family:var(--fh);font-size:24px;letter-spacing:-.03em;font-weight:500;margin-bottom:8px}
.auth-box .sub{color:var(--muted);margin-bottom:24px;font-size:14px;font-weight:500}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#aab9e6}
.f input,.f textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:13px;font:inherit;font-size:14.5px;font-weight:500;background:rgba(255,255,255,.045);color:#fff;outline:none;transition:.2s}
.f input::placeholder,.f textarea::placeholder{color:#6b7aa6}
.f input:focus,.f textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(47,107,255,.22);background:rgba(255,255,255,.07)}
.pw{position:relative}
.pw button{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--blue2)}
.msg{padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.msg.err{background:rgba(255,80,80,.1);color:#ff9a9a;border:1px solid rgba(255,100,100,.3)}
.msg.warn{background:rgba(255,190,60,.1);color:#ffd27a;border:1px solid rgba(255,190,60,.3)}
.msg.ok{background:rgba(52,211,153,.1);color:#7be6bd;border:1px solid rgba(52,211,153,.3);animation:fu .5s}
.alt{text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted);font-weight:500}
.alt a{color:var(--blue2);font-weight:700}

/* ---------- studio ---------- */
.studio{padding:30px 0 70px;position:relative}
.st-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.st-head h2{font-family:var(--fh);font-size:24px;letter-spacing:-.03em;font-weight:500}
.quota{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:11px 16px;min-width:240px}
.quota .row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:7px;color:#b9c6ea}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .6s;box-shadow:0 0 12px rgba(61,123,255,.8)}
.st-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border-radius:22px;padding:22px;animation:fu .7s both}
.card h3{font-size:12px;margin-bottom:12px;color:#aab9e6;font-weight:800;letter-spacing:.08em}
textarea#txt{min-height:230px;resize:vertical;line-height:1.65;font-size:15.5px}
.cnt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:600;font-size:13px;color:#c3cfef;transition:.2s}
.chip:hover{border-color:var(--blue2);transform:translateY(-1px)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 0 20px rgba(47,107,255,.55)}
.voices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:420px;overflow:auto;padding:3px}
.voices::-webkit-scrollbar{width:6px}.voices::-webkit-scrollbar-thumb{background:rgba(130,170,255,.3);border-radius:9px}
.vc{padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.035);text-align:center;transition:.2s}
.vc b{display:block;font-size:13.5px;font-weight:700}
.vc small{color:var(--muted);font-size:11.5px;font-weight:600}
.vc:hover{border-color:var(--blue2);transform:translateY(-2px)}
.vc.on{border-color:rgba(120,170,255,.9);background:rgba(47,107,255,.26);box-shadow:0 0 24px rgba(47,107,255,.45)}
.gen{margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prog{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
.res{margin-top:16px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.035);margin-bottom:10px;animation:si .6s cubic-bezier(.2,.8,.2,1)}
.item p{font-size:13px;color:#c3cfef;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.item audio{width:100%;height:38px}
.item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600;gap:10px;flex-wrap:wrap}
.item a.dl{color:var(--blue2);font-weight:800}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px;font-weight:500}
.user-menu{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:#c3cfef}
.badge{background:rgba(47,107,255,.25);border:1px solid rgba(110,160,255,.4);color:#cfe0ff;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.eq{display:inline-flex;align-items:center;gap:3px;height:20px}
.eq i{width:3px;border-radius:2px;background:linear-gradient(#7aa8ff,#2f6bff);animation:wv .9s ease-in-out infinite;height:30%}

@media(max-width:900px){
  .links{display:none}
  .dash{grid-template-columns:1fr}.d-side{display:none}
  .fl{display:none}
  .bento,.steps,.plans{grid-template-columns:1fr}
  .d-two{grid-template-columns:1fr}
  .st-grid{grid-template-columns:1fr}
  .voices{grid-template-columns:repeat(2,1fr);max-height:320px}

  .hero{padding-top:120px}
  .d-card strong{font-size:17px}
}

/* ================= SHAXSIY KABINET ================= */
[hidden]{display:none!important}
body.light{--ln:rgba(130,165,255,.15);--ln2:rgba(130,165,255,.28);--pn:rgba(255,255,255,.035);--pn2:rgba(255,255,255,.06);--hv:rgba(255,255,255,.07);--mt:#8e9cc7;--mt2:#6b7aa6;--ok:#34d399;--bad:#ff6b6b;
  background:#03050f;color:#eef2ff;font-family:var(--fb)}
body.light .aurora i{opacity:.2}
body.light .spot{background:radial-gradient(380px circle at var(--mx,50%) var(--my,30%),rgba(110,160,255,.09),transparent 65%)}
body.light .msg.err{background:rgba(255,80,80,.1);color:#ff9a9a;border-color:rgba(255,100,100,.3)}
body.light .msg.ok{background:rgba(52,211,153,.1);color:#7be6bd;border-color:rgba(52,211,153,.3)}
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh;transition:grid-template-columns .3s cubic-bezier(.2,.8,.2,1)}
.sbk{display:none}
.flex1{flex:1}
/* sidebar */

.lg2{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:500;font-size:16px;letter-spacing:-.01em;padding:4px 8px 18px;color:#fff}
.lg2 i{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 0 22px rgba(47,107,255,.65);animation:lgp 3s ease-in-out infinite}
@keyframes lgp{50%{box-shadow:0 0 34px rgba(80,140,255,.95)}}
.lg2 i svg{width:17px;height:17px}
.sb nav{display:flex;flex-direction:column;gap:2px}
.ni{position:relative;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:#a9b7df;font-weight:600;font-size:14px;transition:.2s;white-space:nowrap;border:1px solid transparent}

.ni:hover{background:var(--hv);color:#fff;transform:translateX(2px)}.ni:hover svg{color:#9fbaff}
.ni.on{background:linear-gradient(90deg,rgba(47,107,255,.28),rgba(47,107,255,.08));color:#fff;border-color:rgba(110,160,255,.35);box-shadow:0 0 24px rgba(47,107,255,.18)}
.ni.on svg{color:#8fb0ff}
.ni.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--grad);box-shadow:0 0 12px #3d7bff}

.rfh{height:170px;background:radial-gradient(400px 160px at 20% 30%,#7c5cff,transparent),radial-gradient(400px 180px at 80% 20%,#34e0c8,transparent),linear-gradient(135deg,#1d4ed8,#2f6bff,#60a5fa);background-size:200% 200%;animation:bgm 10s ease infinite;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent);mask-image:linear-gradient(180deg,#000 50%,transparent)}
.rfb{padding:0 30px 26px;margin-top:-40px;position:relative}
.rfb h2{font-family:var(--fh);font-size:26px;font-weight:500;letter-spacing:-.03em}.rfb>p{color:var(--mt);margin:6px 0 18px;font-weight:500}
.cap{display:block;color:var(--mt);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px}
.cap2{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#b9c6ea;margin:4px 0 12px}
.how{list-style:none;display:grid;gap:14px;font-size:14.5px;font-weight:600}
.how li{display:flex;gap:12px;align-items:center}.how svg{width:18px;height:18px;color:#8fb0ff;flex:none}
.lnk{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:14px;padding:8px 8px 8px 14px}
.lnk code{flex:1;min-width:0;overflow:auto;white-space:nowrap;font-size:13px;color:#cfe0ff;scrollbar-width:none}
.st4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln)}
.rfh.cl{background:radial-gradient(380px 160px at 18% 30%,#ff8a4c,transparent),radial-gradient(420px 180px at 82% 20%,#7c5cff,transparent),linear-gradient(135deg,#1d4ed8,#2f6bff,#60a5fa);background-size:200% 200%}
.how.num{counter-reset:s}.how.num li{counter-increment:s}.how.num li::before{content:counter(s);width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:rgba(47,107,255,.25);color:#cfe0ff}
.exs{display:grid;gap:8px}.exs button{text-align:left;padding:11px 14px;border-radius:14px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:#dbe4ff;font:600 13.5px var(--fb);transition:.2s}
.exs button:hover{border-color:var(--ln2);background:rgba(47,107,255,.12)}
.lockb{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;border:1px dashed var(--ln2);background:rgba(255,255,255,.03);margin:6px 0 14px}.lockb svg{width:22px;height:22px;color:#ffb27a;flex:none}
.warn3{font-size:12.5px;color:#ffcf9a;font-weight:600;margin-top:10px}
.st4>div{padding:16px 20px}.st4>div+div{border-left:1px solid var(--ln)}
.st4 small{display:block;color:var(--mt);font-size:12px;font-weight:600}.st4 b{font-family:var(--fh);font-size:20px;font-weight:500}
/* modal */
.md{position:fixed;inset:0;z-index:100;background:rgba(1,3,10,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.mdb{width:100%;max-width:460px;max-height:86vh;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(16,26,62,.97),rgba(5,9,26,.98));border:1px solid var(--ln2);border-radius:24px;padding:20px;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 60px rgba(47,107,255,.2);animation:pop .3s cubic-bezier(.2,.8,.2,1) both;color:#eef2ff;overflow:auto;font-family:var(--fb)}
.mdb.mid{max-width:680px}.mdb.wide{max-width:1080px;height:min(760px,86vh);padding:0;overflow:hidden}
.mdh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.mdh b{font-family:var(--fh);font-size:17px;font-weight:500;display:block;letter-spacing:-.02em}.mdh small{color:var(--mt);font-size:13px;font-weight:500}
.mdf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pyo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pyo button{position:relative;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:#dbe4ff;transition:.2s;font-family:var(--fb)}
.pyo button:hover{border-color:var(--ln2)}.pyo button.on{border-color:#4f86ff;background:rgba(47,107,255,.14);box-shadow:0 0 0 3px rgba(47,107,255,.18)}
.pyo b{display:block;font-family:var(--fh);font-weight:500;font-size:18px;color:#fff;margin-top:4px}.pyo small{color:var(--mt);font-size:12.5px;font-weight:600}
.pyo em{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;font-weight:800;color:#06102a;background:#7cf0c0;border-radius:99px;padding:2px 8px}
.pysum{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px dashed var(--ln2)}
.pysum b{font-family:var(--fh);font-size:22px;font-weight:500;color:#fff}.pysum span{color:var(--mt);font-size:13px;font-weight:600}
.paybx{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:18px;border:1px solid var(--ln2);background:linear-gradient(120deg,rgba(47,107,255,.16),rgba(124,240,192,.08));margin-bottom:18px}
.paybx.ok{border-color:rgba(124,240,192,.5)}.paybx.bad{border-color:rgba(255,110,110,.45);background:rgba(255,80,80,.07)}
.paybx b{display:block;color:#fff;font-size:15px}.paybx small{color:var(--mt);font-size:13px;font-weight:500}.paybx .flex1{flex:1}
.paybx .pi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}.paybx .pi svg{width:22px;height:22px}
.secure{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mt2);font-size:12px;font-weight:600}.secure svg{width:14px;height:14px}
.pyl{display:grid;grid-template-columns:120px minmax(0,1.3fr) 120px 110px 110px;gap:12px;align-items:center}
@media(max-width:1020px){.pyl{grid-template-columns:90px minmax(0,1fr) 100px}.pyl>span:nth-child(3),.pyl>span:nth-child(4){display:none}}
.ta{width:100%;min-height:260px;border:1px solid var(--ln);border-radius:16px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;line-height:1.7;resize:vertical;outline:0;color:#fff;background:rgba(255,255,255,.04)}
.ta:focus{border-color:#5b8cff}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2c .lb{margin-top:0}
.vpk{display:grid;grid-template-columns:300px 1fr;height:100%}
.vpk aside{border-right:1px solid var(--ln);padding:22px;overflow:auto;background:rgba(255,255,255,.02)}
.vpk aside .chips3{margin-bottom:24px}
.vpk section{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0}
.vph{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}
.vpl{overflow:auto;padding:6px 10px}
.mdb.pal{max-width:640px;padding:0;gap:0;align-self:start;margin-top:12vh}
.big2{border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:4px 18px;background:none}.big2:focus-within{box-shadow:none;border-color:var(--ln)}.big2 input{padding:15px 0;font-size:15.5px}
.pl4{padding:8px;max-height:60vh;overflow:auto}
.pl4 small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mt2);padding:12px 10px 6px}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;text-align:left;transition:.15s}
.pi:hover{background:rgba(47,107,255,.15)}
.pi>span:not(.vav):not(.pic){flex:1;min-width:0}.pi b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi em{font-style:normal;font-size:12.5px;color:var(--mt);font-weight:500}
.pic{width:36px;height:36px;border-radius:11px;background:rgba(47,107,255,.18);border:1px solid var(--ln2);display:grid;place-items:center;flex:none;color:#8fb0ff}.pic svg{width:17px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:linear-gradient(135deg,rgba(25,55,140,.95),rgba(8,16,44,.97));border:1px solid var(--ln2,rgba(130,165,255,.28));color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);z-index:200;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 30px rgba(47,107,255,.35);font-family:var(--fb)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* scrollbar */
body.light ::-webkit-scrollbar{width:9px;height:9px}body.light ::-webkit-scrollbar-thumb{background:rgba(130,165,255,.25);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
body.light ::-webkit-scrollbar-track{background:transparent}
@media(max-width:1180px){.trend{grid-template-columns:repeat(2,1fr)}.th,.ar{grid-template-columns:minmax(0,1fr) 120px 110px}.th span:nth-child(3),.th span:nth-child(4),.ar .ad,.ar .at{display:none}.vrow .tagx:nth-of-type(3){display:none}}
@media(max-width:1020px){
  .tts{grid-template-columns:1fr}.rp{position:static;height:auto;border-left:0;border-top:1px solid var(--ln)}
  .plg2,.g2b{grid-template-columns:1fr}.gsearch{width:auto}.gsearch span,.gsearch kbd{display:none}
  .vpk{grid-template-columns:1fr}.vpk aside{display:none}
}
@media(max-width:900px){
  .shell,.shell.col{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .shell.col .sb span,.shell.col .gl,.shell.col .qcard{display:revert}.shell.col .ni{justify-content:flex-start}
  .sb.open{transform:none}
  .sb.open+.sbk{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:35}
  .hide-m{display:none}
  .pg{padding:24px 16px 60px}.edi{padding:20px 12px}.edbar{padding:12px 16px}
  .trend{grid-template-columns:1fr}.tools{grid-template-columns:1fr}
  .th{display:none}.ar{grid-template-columns:minmax(0,1fr) auto}.ar .ak{display:none}
  .vrow .tagx{display:none}
  .st4{grid-template-columns:1fr 1fr}.st4>div:nth-child(3){border-left:0;border-top:1px solid var(--ln)}.st4>div:nth-child(4){border-top:1px solid var(--ln)}
  .rfb{padding:0 18px 22px}.g2c{grid-template-columns:1fr}
  .steps2{flex-direction:column}.dzf{flex-wrap:wrap}
}

/* ---- admin ---- */
.annc{display:flex;align-items:center;gap:12px;margin:14px 30px 0;padding:11px 14px;border-radius:16px;border:1px solid rgba(110,160,255,.4);background:linear-gradient(90deg,rgba(47,107,255,.22),rgba(111,227,211,.08));font-size:14px;font-weight:600;animation:su .5s both}
.annc>span:nth-child(2){flex:1}.annc .ai{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 0 16px rgba(47,107,255,.6)}.annc .ai svg{width:15px;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}

.tile small{color:var(--mt);font-size:12.5px;font-weight:600}.tile b{font-family:var(--fh);font-size:26px;font-weight:500;letter-spacing:-.04em}.tile em{font-style:normal;color:var(--mt2);font-size:12px;font-weight:500}
.tile.good .ti{color:#6fe3d3;background:rgba(52,211,153,.12)}.tile.bad{border-color:rgba(255,107,107,.4)}.tile.bad .ti{color:#ff9a9a;background:rgba(255,80,80,.14)}.tile.bad em{color:#ff9a9a}
.chc{display:flex;flex-direction:column}
.chh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}.chh b{display:block;font-size:14.5px}.chh small{color:var(--mt);font-size:12.5px;font-weight:500}
.chv{font-family:var(--fh);font-size:20px;letter-spacing:-.03em;white-space:nowrap}.chv small{font-family:var(--fb);font-size:12px;color:var(--mt)}
.cg{display:flex;gap:10px;height:190px;padding-bottom:22px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mt2);font-weight:600;text-align:right;min-width:30px;margin:-6px 0}
.plot{flex:1;position:relative;display:flex;align-items:flex-end;gap:5px}
.gl1{position:absolute;left:0;right:0;height:1px;background:rgba(130,165,255,.1)}.gl1.base{background:rgba(130,165,255,.3)}
.bc{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;cursor:default;outline:0}
.bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#6aa0ff,#2358ff);box-shadow:0 0 14px rgba(61,123,255,.45);transition:filter .2s;transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) backwards}
.bar.z{height:2px!important;background:rgba(130,165,255,.25);box-shadow:none}
.bc:hover .bar,.bc:focus .bar{filter:brightness(1.35)}
.bc em{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;color:var(--mt2);font-weight:600;white-space:nowrap}
.tt{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,6px);background:#0b1430;border:1px solid var(--ln2);border-radius:10px;padding:6px 10px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:3;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.tt b{display:block;font-size:13px}.tt small{color:var(--mt);font-size:11.5px}
.bc:hover .tt,.bc:focus .tt{opacity:1;transform:translate(-50%,0)}
.bc .tt{bottom:auto;top:-46px}
.g3a{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hb2{display:grid;gap:12px}.hb2>div{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.hb2 i{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.hb2 i b{display:block;height:100%;background:var(--grad);border-radius:9px;box-shadow:0 0 10px #3d7bff;animation:gw 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes gw{from{width:0!important}}
.hb2 em{font-style:normal;text-align:right;font-family:var(--fh);font-size:14px}
.kd{display:grid;gap:10px}.kd>div{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.kd>div span:nth-child(2){flex:1;color:#c3cfef}.kd b{font-family:var(--fh);font-weight:500;font-size:17px}
.tops{display:grid;gap:8px}.tops>div{display:flex;align-items:center;gap:10px}.tops>div>span:nth-child(2){flex:1;min-width:0}.tops b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tops small{color:var(--mt);font-size:12px}
.tops em{font-style:normal;font-family:var(--fh);font-size:14px;color:#cfe0ff}
.uh,.ur{display:grid;grid-template-columns:minmax(0,2fr) 120px 150px 70px 100px 120px 130px;gap:12px;align-items:center}
.uh,.lh2{font-size:11.5px;color:var(--mt2);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--ln)}
.ur{padding:10px 12px;border-bottom:1px solid rgba(130,165,255,.08);border-radius:14px;cursor:pointer;font-size:13.5px;color:#c3cfef;font-weight:500;transition:.15s}
.ur:hover{background:rgba(47,107,255,.09);box-shadow:0 0 0 1px rgba(110,160,255,.25) inset}
.un{display:flex;align-items:center;gap:10px;min-width:0}.un>span:last-child{min-width:0}.un b{display:block;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.un small{color:var(--mt);font-size:12.5px}
.avs{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.pbg{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.07);color:#c3cfef;border:1px solid var(--ln)}
.pbg.p-pro{background:rgba(47,107,255,.2);color:#cfe0ff;border-color:rgba(110,160,255,.45)}.pbg.p-business{background:rgba(124,92,255,.22);color:#ddd2ff;border-color:rgba(160,130,255,.5)}
.uu small{display:block;font-size:12px}.uu i{display:block;height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}.uu i b{display:block;height:100%;background:var(--grad)}
.sbg{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}.sbg svg{width:13px;height:13px}
.sbg.ok{background:rgba(52,211,153,.12);color:#7be6bd}.sbg.bad{background:rgba(255,80,80,.14);color:#ff9a9a}

.lr{padding:10px 12px;border-bottom:1px solid rgba(130,165,255,.08);border-radius:12px;font-size:13px;color:#c3cfef;font-weight:500}
.lr:hover{background:rgba(255,255,255,.03)}.lr.er{background:rgba(255,80,80,.05)}
.lr small{display:block;color:var(--mt2);font-size:11.5px}.lr b{display:block;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdl{font-family:ui-monospace,monospace;font-size:12px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnote{grid-column:1/-1;font-size:12px;color:#ff9a9a;font-family:ui-monospace,monospace;background:rgba(255,80,80,.08);border-radius:8px;padding:6px 10px;word-break:break-word}
.ust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ust>div{border:1px solid var(--ln);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.03)}.ust small{display:block;color:var(--mt);font-size:12px}.ust b{font-size:14.5px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:#c3cfef;cursor:pointer;margin-top:6px}.chk input{width:17px;height:17px;accent-color:#3d7bff}
.sub3 code,.note code{background:rgba(255,255,255,.07);border-radius:6px;padding:1px 6px;font-size:12.5px;color:#cfe0ff}

/* ---- Audio: base64 -> PCM -> WAV ---- */
function b64ToBytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function extractPcm(bytes, mime){
  let rate = 24000;
  const m = /rate=(\d+)/i.exec(mime||""); if(m) rate = +m[1];
  const tag = i => String.fromCharCode(bytes[i],bytes[i+1],bytes[i+2],bytes[i+3]);
  if(bytes.length>44 && tag(0)==="RIFF"){
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let p = 12;
    while(p+8 <= bytes.length){
      const id = tag(p), size = dv.getUint32(p+4,true);
      if(id==="fmt ") rate = dv.getUint32(p+12,true);
      if(id==="data"){
        const end = (size===0 || size===0xFFFFFFFF || p+8+size>bytes.length) ? bytes.length : p+8+size;
        return {pcm: bytes.subarray(p+8,end), rate};
      }
      if(size===0xFFFFFFFF) break;
      p += 8 + size + (size&1);
    }
    return {pcm: bytes.subarray(44), rate};
  }
  return {pcm: bytes, rate};
}
function buildWav(chunks, rate){
  let total = 0; chunks.forEach(c => total += c.length);
  total -= total % 2;
  const out = new Uint8Array(44 + total), dv = new DataView(out.buffer);
  const w = (o,s) => { for(let i=0;i<s.length;i++) out[o+i]=s.charCodeAt(i); };
  w(0,"RIFF"); dv.setUint32(4,36+total,true); w(8,"WAVE"); w(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,rate,true); dv.setUint32(28,rate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,"data"); dv.setUint32(40,total,true);
  let off = 44;
  for(const c of chunks){ const n = Math.min(c.length, 44+total-off); out.set(c.subarray(0,n), off); off += n; if(off>=44+total) break; }
  return {blob: new Blob([out],{type:"audio/wav"}), seconds: total/2/rate};
}

/* ---- Matnni bo'laklash ---- */
function splitText(text, max){
  const parts = text.replace(/\r/g,"").match(/[^.!?…\n]+[.!?…]*\s*/g) || [text];
  const out = []; let cur = "";
  const push = () => { if(cur.trim()) out.push(cur.trim()); cur=""; };
  for(let s of parts){
    while(s.length > max){
      let cut = s.lastIndexOf(" ", max); if(cut < max*0.5) cut = max;
      if(cur) push();
      out.push(s.slice(0,cut).trim()); s = s.slice(cut);
    }
    if((cur+s).length > max) push();
    cur += s;
  }
  push();
  return out;
}

function setupReveal(){
  const els = document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12, rootMargin:"0px 0px -40px 0px"});
  els.forEach(e=>io.observe(e));
}

function typeLoop(el, lines){
  let li = 0, ci = 0, del = false;
  const step = () => {
    if(!el.isConnected) return;
    const full = lines[li];
    if(!del){ ci++; el.textContent = full.slice(0,ci); if(ci>=full.length){ del=true; later(step, 1800); return; } later(step, 38+Math.random()*40); }
    else { ci -= 2; if(ci<=0){ ci=0; del=false; li=(li+1)%lines.length; el.textContent=""; later(step, 400); return; } el.textContent = full.slice(0,ci); later(step, 16); }
  };
  step();
}

function countUp(el, to, ms=1400){
  const t0 = performance.now();
  const f = t => { const p = Math.min(1,(t-t0)/ms), e = 1-Math.pow(1-p,3); el.textContent = fmt(Math.round(to*e)); if(p<1 && el.isConnected) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

function bindAuth(mode){
  const form = $("#af"), msg = $("#amsg"), btn = $("#asub");
  const bad = t => { msg.innerHTML = `<div class="msg err">${t}</div>`; };
  bindPhoneMask(form.phone);
  $("#tp").onclick = e => { const i=form.password; i.type = i.type==="password"?"text":"password"; e.target.textContent = i.type==="password"?"Ko'rsat":"Yashir"; };
  if(mode!=="login" && BOT===null) loadBot().then(b => { if(b && $("#af")===form){ $("#app").innerHTML = authPage(mode); bindNav(); bindAuth(mode); } });
  if(mode==="reset" && BOT==="") bad("Parolni tiklash hozircha yoqilmagan. Admin bilan bog'laning.");
  const finish = r => { store.token = r.token; USER = r.user; PREFILL = ""; location.hash = "#/app"; };

  form.onsubmit = async ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    msg.innerHTML = "";
    if(mode==="register" && (d.name||"").trim().length<2) return bad("Ismingizni kiriting");
    if((d.password||"").length<6) return bad("Parol kamida 6 belgi bo'lsin");
    if(mode==="register") d.ref = getRef();

    if(BOT && mode!=="login"){                       // Telegram orqali tasdiqlash
      const a = new Uint8Array(20); crypto.getRandomValues(a);
      const code = [...a].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"[x%57]).join("");
      const link = `https://t.me/${BOT}?start=${mode==="register"?"r":"p"}_${code}`;
      window.open(link, "_blank");
      form.hidden = true;
      const w = $("#wait"); w.hidden = false;
      w.innerHTML = `<div class="tgw"><div class="tgi">${TG_ICON}</div>
        <ol><li>Telegram'da <b>@${esc(BOT)}</b> boti ochildi — <b>Start</b>ni bosing</li><li><b>«📱 Raqamni ulashish»</b> tugmasini bosing</li><li>Shu sahifaga qayting — qolgani avtomatik</li></ol>
        <a class="btn btn-p" style="width:100%;padding:14px" href="${link}" target="_blank" rel="noopener">${TG_ICON} Botni ochish</a>
        <div class="tgs"><span class="spin"></span> Tasdiqlash kutilmoqda...</div>
        <button class="lnk2" id="wcancel">Bekor qilish</button></div>`;
      let done = false, t0 = Date.now();
      const stop = () => { done = true; document.removeEventListener("visibilitychange", check); };
      $("#wcancel").onclick = () => { stop(); w.hidden = true; form.hidden = false; };
      const check = async () => {
        if(done || !$("#wait")) return stop();
        if(Date.now()-t0 > 14*60000){ stop(); w.hidden = true; form.hidden = false; return bad("Vaqt tugadi. Qaytadan urinib ko'ring."); }
        const r = await api("vcheck", {code});
        if(done || !r.ok || r.st==="wait") return;
        stop();
        if(r.st==="exists"){ w.hidden = true; form.hidden = false; return bad(`Bu raqam bilan avval ro'yxatdan o'tilgan. <a href="#/login">Kirish</a> yoki <a href="#/reset">parolni tiklash</a>.`); }
        if(r.st==="none"){ w.hidden = true; form.hidden = false; return bad(`Bu raqam bilan akkaunt topilmadi. <a href="#/register">Ro'yxatdan o'ting</a>.`); }
        $(".tgs").innerHTML = `<span class="spin"></span> ${fmtPhone(r.phone)} tasdiqlandi — kirilmoqda...`;
        const r2 = await api(mode, Object.assign(d, {vcode: code}));
        if(!r2.ok){ w.hidden = true; form.hidden = false; return bad(esc(r2.error || "Xatolik")); }
        finish(r2);
      };
      every(check, 2500);
      document.addEventListener("visibilitychange", check);
      return;
    }

    if(mode==="reset") return bad("Parolni tiklash hozircha yoqilmagan. Admin bilan bog'laning.");
    const digits = (d.phone||"").replace(/\D/g,"");
    if(digits.length!==9) return bad("Telefon raqamni to'liq kiriting (9 ta raqam, masalan: 90 123 45 67)");
    d.phone = "998" + digits;
    btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> Kuting...';
    const r = await api(mode, d);
    btn.disabled = false; btn.innerHTML = old;
    if(!r.ok) return bad(esc(r.error||"Xatolik"));
    finish(r);
  };
}

function dbOpen(){
  return DBP || (DBP = new Promise((res, rej) => {
    const r = indexedDB.open("ovozai", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("assets",{keyPath:"id"}); d.createObjectStore("books",{keyPath:"id"}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function dbReq(st, mode, fn){
  const d = await dbOpen();
  return new Promise((res, rej) => { const t = d.transaction(st, mode), q = fn(t.objectStore(st)); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); });
}
async function dbAll(st){ try{ return await dbReq(st,"readonly",s=>s.getAll()); }catch(e){ return MEM[st].slice(); } }
async function dbPut(st, v){ try{ await dbReq(st,"readwrite",s=>s.put(v)); }catch(e){ const a = MEM[st], i = a.findIndex(x=>x.id===v.id); i>=0 ? a[i]=v : a.push(v); } }
async function dbDel(st, id){ try{ await dbReq(st,"readwrite",s=>s.delete(id)); }catch(e){ MEM[st] = MEM[st].filter(x=>x.id!==id); } }

function toast(t){
  let el = $("#toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.append(el); }
  el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 2400);
}
function setQuota(u, l){
  if(USER){ USER.used = u; USER.limit = l; }
  const p = Math.min(100, u/l*100), left = Math.max(0, l-u);
  const t = $("#qt"), b = $("#qb"), r = $("#avr"), q = $("#qleft"), qc = $("#qcard");
  if(t) t.textContent = `${fmt(left)} belgi qoldi`;
  if(b) b.style.width = p + "%";
  if(r) r.style.background = `conic-gradient(${p>85?"#ff6b6b":"#5b8cff"} ${p}%, rgba(255,255,255,.12) 0)`;
  if(q) q.textContent = fmt(left);
  if(qc) qc.classList.toggle("low", p > 80);
}
function initials(n){ return String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase(); }

function buildStyle(){
  const p = [];
  if(SEL.style) p.push(SEL.style);
  const s = +SEL.speed;
  if(s <= 0.8) p.push("speaking slowly"); else if(s < 0.95) p.push("speaking a little slowly");
  else if(s >= 1.2) p.push("speaking quickly"); else if(s > 1.05) p.push("speaking a little faster");
  if(SEL.lang) p.push("in " + SEL.lang);
  return p.join(", ").slice(0, 160);
}
const dur = s => { s = Math.round(s||0); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
function ago(ms){
  const d = (Date.now()-ms)/1000;
  if(d < 60) return "hozirgina"; if(d < 3600) return Math.floor(d/60) + " daqiqa oldin";
  if(d < 86400) return Math.floor(d/3600) + " soat oldin"; if(d < 172800) return "kecha";
  return new Date(ms).toLocaleDateString("ru-RU");
}
function apiFail(r){
  if(r.error==="auth"){ store.token=""; USER=null; location.hash="#/login"; return {ok:false, error:""}; }
  if(r.error==="limit"){ if(r.used!=null) setQuota(r.used, r.limit); return {ok:false, error:r.message}; }
  return {ok:false, error:r.error||"Xatolik yuz berdi"};
}

/* ---- Ovoz sintezi (bir yoki bir necha spiker) ---- */
async function synth(segments, prog){
  segments = segments.filter(s => s.text && s.text.trim());
  const total = segments.reduce((a,s)=>a+s.text.trim().length, 0);
  if(!total) return {ok:false, error:"Avval matn kiriting"};
  const left = USER.limit - USER.used;
  if(total > left) return {ok:false, error:`Bugungi qolgan limit: ${fmt(left)} belgi. Matnni qisqartiring yoki tarifni oshiring.`};
  const style = buildStyle(), jobs = [];
  segments.forEach(s => splitText(s.text.trim(), CONFIG.MAX_CHUNK).forEach((t,pi) =>
    jobs.push({voice:s.voice, text:t, gap: jobs.length ? (pi===0 ? 0.4 : 0.18) : 0})));
  const pcms = []; let rate = 24000;
  for(let i=0;i<jobs.length;i++){
    prog && prog(i, jobs.length);
    const r = await api("tts", {text: jobs[i].text, voice: jobs[i].voice, style});
    if(!r.ok) return apiFail(r);
    const x = extractPcm(b64ToBytes(r.audio), r.mime); rate = x.rate;
    if(jobs[i].gap) pcms.push(new Uint8Array(Math.round(rate*jobs[i].gap)*2));
    pcms.push(x.pcm); setQuota(r.used, r.limit);
  }
  const w = buildWav(pcms, rate);
  return {ok:true, blob:w.blob, seconds:w.seconds};
}
async function blobPcm(blob){ return extractPcm(new Uint8Array(await blob.arrayBuffer()), "audio/wav"); }

/* ---- Pleyer ---- */
function setPlayBtns(){
  document.querySelectorAll("[data-play]").forEach(b => {
    const on = PLAYER && PLAYER._k===b.dataset.play && !PLAYER.paused;
    if(b.querySelector(".spin") && !on && PLAYER && PLAYER._k===b.dataset.play) return;
    b.innerHTML = on ? IC.stop : IC.play; b.classList.toggle("on", on);
  });
}
async function togglePlay(key, getUrl, btn){
  if(PLAYER && PLAYER._k===key && !PLAYER.paused){ PLAYER.pause(); return; }
  if(PLAYER) PLAYER.pause();
  if(btn) btn.innerHTML = '<span class="spin dk"></span>';
  const url = await getUrl();
  if(!url){ setPlayBtns(); return; }
  PLAYER = new Audio(url); PLAYER._k = key;
  PLAYER.onplay = PLAYER.onpause = PLAYER.onended = setPlayBtns;
  PLAYER.play().catch(()=>setPlayBtns());
}
function voiceSample(name){
  return async () => {
    if(STATIC_SAMPLES.has(name)) return "samples/" + name + ".mp3";
    if(SAMPLES[name]) return SAMPLES[name];
    const r = await api("tts", {text:`Assalomu alaykum! Men ${name}. Matningizni shu ovozda o'qib beraman.`, voice:name, style:""});
    if(!r.ok){ const f = apiFail(r); if(f.error) toast(f.error); return null; }
    setQuota(r.used, r.limit);
    const x = extractPcm(b64ToBytes(r.audio), r.mime);
    return SAMPLES[name] = URL.createObjectURL(buildWav([x.pcm], x.rate).blob);
  };
}

/* ---- Modal oynalar ---- */
function modal(html, cls=""){
  const m = document.createElement("div"); m.className = "md";
  m.innerHTML = `<div class="mdb ${cls}">${html}</div>`;
  document.body.append(m);
  const close = () => { m.remove(); document.removeEventListener("keydown", k); };
  const k = e => { if(e.key==="Escape") close(); };
  document.addEventListener("keydown", k);
  m.addEventListener("mousedown", e => { if(e.target===m) close(); });
  m.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  return {el:m, close};
}

function b64ToBlob(b64, mime){ const bin = atob(b64), a = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type: mime||"application/octet-stream"}); }
function shrinkImage(file, max = 1536){
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const png = /png|webp/.test(file.type||""), d = c.toDataURL(png ? "image/png" : "image/jpeg", .9);
      URL.revokeObjectURL(u); res({mime: png ? "image/png" : "image/jpeg", data: d.split(",")[1]}); };
    img.onerror = () => rej(new Error("Rasmni o'qib bo'lmadi")); img.src = u; });
}

/** Uzoq ishlar (video, sayt): chipta oladi va Worker orqali bajaradi */
async function studioRun(kind, body, onChunk){
  const t = await api("ticket", {kind});
  if(!t.ok){ const f = apiFail(t); return {ok:false, error:f.error||"Xatolik", upgrade:t.upgrade}; }
  try{
    const r = await fetch(t.worker.replace(/\/+$/,"") + (kind==="vid" ? "/ai/video" : "/ai/site"), {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ticket:t.ticket, ...body})});
    if(/json/.test(r.headers.get("content-type")||"")){ const j = await r.json(); if(j.ok){ j.used = t.used; j.limit = t.limit; } return j; }
    // jonli oqim: kod yozilayotganini ko'rsatib boramiz
    const rd = r.body.getReader(), dec = new TextDecoder(); let all = "";
    for(;;){ const {value, done} = await rd.read(); if(done) break; all += dec.decode(value, {stream:true}); if(onChunk) onChunk(all); }
    if(all.includes("[[GAPIR_ERROR]]")) return {ok:false, error:"Sayt yaratilmadi — birozdan keyin qayta urinib ko'ring."};
    const m = all.match(/```(?:html)?\s*([\s\S]*?)(```|$)/i), html = (m ? m[1] : all).trim();
    if(!/<html|<!doctype/i.test(html)) return {ok:false, error:"Sayt to'liq chiqmadi — qayta urinib ko'ring."};
    return {ok:true, html, used:t.used, limit:t.limit};
  }catch(e){ return {ok:false, error:"Internet aloqasi uzildi. Qayta urinib ko'ring."}; }
}

function bindDrop(box, onFile){
  const inp = box.querySelector("input[type=file]"), dz = box.querySelector(".dz"), dzf = box.querySelector(".dzf");
  let rec = null, chunks = [], t0 = 0, timer = null;
  const show = f => {
    if(!f) return;
    if(f.size > 13*1024*1024){ toast("Fayl 13 MB dan katta bo'lmasin"); return; }
    dz.hidden = true; dzf.hidden = false;
    dzf.querySelector(".fn").textContent = f.name || "Yozuv";
    dzf.querySelector(".fs").textContent = (f.size/1024/1024).toFixed(2) + " MB";
    dzf.querySelector("audio").src = URL.createObjectURL(f);
    onFile(f);
  };
  box.querySelector("[data-up]").onclick = () => inp.click();
  inp.onchange = () => show(inp.files[0]);
  box.addEventListener("dragover", e => { e.preventDefault(); box.classList.add("hov"); });
  box.addEventListener("dragleave", () => box.classList.remove("hov"));
  box.addEventListener("drop", e => { e.preventDefault(); box.classList.remove("hov"); show(e.dataTransfer.files[0]); });
  box.querySelector("[data-clear]").onclick = () => { dz.hidden = false; dzf.hidden = true; inp.value = ""; onFile(null); };
  const rb = box.querySelector("[data-rec]");
  rb.onclick = async () => {
    if(rec){ rec.stop(); return; }
    try{
      const st = await navigator.mediaDevices.getUserMedia({audio:true});
      rec = new MediaRecorder(st); chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => { st.getTracks().forEach(t=>t.stop()); clearInterval(timer); rb.classList.remove("rec"); rb.innerHTML = `${IC.mic} Yozib olish`;
        const b = new Blob(chunks, {type: rec.mimeType || "audio/webm"}); rec = null;
        show(new File([b], "Mikrofon yozuvi " + new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) + ".webm", {type:b.type})); };
      rec.start(); t0 = Date.now(); rb.classList.add("rec");
      timer = setInterval(()=>{ rb.innerHTML = `<i class="rdot"></i> To'xtatish ${dur((Date.now()-t0)/1000)}`; }, 300);
    }catch(e){ toast("Mikrofonga ruxsat berilmadi"); }
  };
}

  const sess = await upLoad(), R = 4, T = 128, P = 10;
  const W = cv.width, H = cv.height, src = cv.getContext("2d").getImageData(0, 0, W, H).data;
  const OW = W*R, OH = H*R, out = new ImageData(OW, OH), od = out.data;
  const tiles = []; for(let y = 0; y < H; y += T) for(let x = 0; x < W; x += T) tiles.push([x, y]);
  for(let k = 0; k < tiles.length; k++){
    const [tx, ty] = tiles[k], tw = Math.min(T, W-tx), th = Math.min(T, H-ty);
    const x0 = Math.max(0, tx-P), y0 = Math.max(0, ty-P), x1 = Math.min(W, tx+tw+P), y1 = Math.min(H, ty+th+P);
    const pw = x1-x0, ph = y1-y0, n = pw*ph, inp = new Float32Array(3*n);
    for(let y = 0; y < ph; y++) for(let x = 0; x < pw; x++){
      const si = ((y0+y)*W + x0+x)*4, di = y*pw + x;
      inp[di] = src[si]/255; inp[n+di] = src[si+1]/255; inp[2*n+di] = src[si+2]/255;
    }
    const res = await sess.run({input: new ort.Tensor("float32", inp, [1, 3, ph, pw])});
    const t = res.output, o = t.location && t.location !== "cpu" ? await t.getData() : t.data;
    const opw = pw*R, on = opw*ph*R, ox = (tx-x0)*R, oy = (ty-y0)*R;
    for(let y = 0; y < th*R; y++){
      let si = (oy+y)*opw + ox, di = ((ty*R+y)*OW + tx*R)*4;
      for(let x = 0; x < tw*R; x++, si++, di += 4){ od[di] = o[si]*255; od[di+1] = o[on+si]*255; od[di+2] = o[2*on+si]*255; od[di+3] = 255; }
    }
    if(t.dispose) t.dispose();
    onProg((k+1)/tiles.length);
    await new Promise(r => setTimeout(r));   // sahifa qotib qolmasin
  }
  let oc = document.createElement("canvas"); oc.width = OW; oc.height = OH; const ox2 = oc.getContext("2d");
  let hasA = false; for(let i = 3; i < src.length; i += 4) if(src[i] < 255){ hasA = true; break; }
  if(hasA){   // shaffof PNG: alfa kanalini silliq kattalashtirib qaytarish
    const ac = document.createElement("canvas"); ac.width = OW; ac.height = OH; const ax = ac.getContext("2d");
    ax.imageSmoothingQuality = "high"; ax.drawImage(cv, 0, 0, OW, OH); const ad = ax.getImageData(0, 0, OW, OH).data;
    for(let i = 3; i < od.length; i += 4) od[i] = ad[i];
  }
  ox2.putImageData(out, 0, 0);
  if(scale !== R){ const c2 = document.createElement("canvas"); c2.width = W*scale; c2.height = H*scale; const x2 = c2.getContext("2d");
    x2.imageSmoothingQuality = "high"; x2.drawImage(oc, 0, 0, c2.width, c2.height); oc = c2; }
  return await new Promise((ok, no) => oc.toBlob(b => b ? ok(b) : no(new Error("toBlob")), "image/png"));
}

      const fail = msg => { BUSY = false; if(!$("#go")) return; go.disabled = false; if(msg) out.innerHTML = `<div class="msg err">${esc(msg)}</div>`; };

  upscale(){
    let src = null, out = null, scale = 2;
    $("#pgv").innerHTML = `<div class="pg">
      <div class="ph"><div><h1 class="t2">Rasmni tiniqlash</h1><p class="sub3">Xira va kichik rasmlarni sun'iy intellekt bilan 2 yoki 4 barobar kattalashtiring. <b class="upfree">Bepul — limit olmaydi</b></p></div></div>
      <div class="box">
        <div class="drop updrop" id="udrop"><input type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <div class="dz"><b>Tiniqlashtirish uchun rasm qo'shing</b><span>PNG, JPG yoki WEBP — shu yerga tashlang yoki tanlang</span>
            <div class="dzb"><button class="btn-l" data-up>${IC.upload} Rasm tanlash</button></div></div>
          <div class="upprev" hidden><img alt=""><div><b class="fn"></b><small class="fs"></small></div><button class="ib" data-clear title="Olib tashlash">${IC.x}</button></div></div>
        <div class="boxbar"><div class="seg" id="usc"><button class="on" data-s="2">2x</button><button data-s="4">4x</button></div>
          <span class="prog2" id="uinfo"></span><div class="flex1"></div>
          <button class="gob" id="ugo" disabled title="Tiniqlashtirish">${IC.up}</button></div></div>
      <div class="note">🔒 Rasm hech qayerga yuborilmaydi — hammasi qurilmangizda bajariladi. Real-ESRGAN modeli: xiralik, JPEG "katakchalari" va shovqinni tozalaydi. Birinchi marta ~5 MB yuklanadi.</div>
      <div id="uout"></div></div>`;
    const box = $("#udrop"), inp = box.querySelector("input"), dz = box.querySelector(".dz"), pv = box.querySelector(".upprev");
    const info = () => { if(!src) { $("#uinfo").textContent = ""; return; }
      const f = upFit(src.w, src.h, scale);
      $("#uinfo").innerHTML = `${src.w}×${src.h} → <b>${f.w*scale}×${f.h*scale}</b>` + (f.w < src.w ? ` <span class="upw">(avval ${f.w}×${f.h} ga kichraytiriladi)</span>` : ""); };
    const pick = async f => {
      if(!f) return;
      if(!/^image\/(png|jpe?g|webp)$/.test(f.type)){ toast("Faqat PNG, JPG yoki WEBP rasm"); return; }
      if(f.size > 20*1024*1024){ toast("Rasm 20 MB dan katta bo'lmasin"); return; }
      const url = URL.createObjectURL(f), img = new Image(); img.src = url;
      try{ await img.decode(); }catch(e){ toast("Rasmni ochib bo'lmadi"); return; }
      src = {img, url, w:img.naturalWidth, h:img.naturalHeight, name:f.name.replace(/\.[^.]+$/,"")};
      dz.hidden = true; pv.hidden = false; pv.querySelector("img").src = url;
      pv.querySelector(".fn").textContent = f.name; pv.querySelector(".fs").textContent = `${src.w}×${src.h} · ${(f.size/1024/1024).toFixed(2)} MB`;
      $("#ugo").disabled = false; $("#uout").innerHTML = ""; info();
    };
    box.querySelector("[data-up]").onclick = () => inp.click();
    inp.onchange = () => pick(inp.files[0]);
    box.addEventListener("dragover", e => { e.preventDefault(); box.classList.add("hov"); });
    box.addEventListener("dragleave", () => box.classList.remove("hov"));
    box.addEventListener("drop", e => { e.preventDefault(); box.classList.remove("hov"); pick(e.dataTransfer.files[0]); });
    box.querySelector("[data-clear]").onclick = () => { if(BUSY) return; src = null; dz.hidden = false; pv.hidden = true; inp.value = ""; $("#ugo").disabled = true; $("#uout").innerHTML = ""; info(); };
    $("#usc").onclick = e => { const b = e.target.closest("button"); if(!b || BUSY) return;
      $("#usc").querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); scale = +b.dataset.s; info(); };

    $("#ugo").onclick = async () => {
      if(!src || BUSY) return; BUSY = true;
      const go = $("#ugo"); go.disabled = true; go.innerHTML = '<span class="spin"></span>';
      const bar = p => { const o = $("#uout"); if(o) o.innerHTML = `<div class="upbar"><div class="upbt"><span>${p.t}</span><b>${p.v!=null ? Math.round(p.v*100)+"%" : ""}</b></div><i><s style="width:${(p.v||0)*100}%"></s></i></div>`; };
      const t0 = Date.now();
      try{
        bar({t:"Model yuklanmoqda (bir marta, ~5 MB)..."});
        await upLoad();
        // katta rasmni oldindan kichraytirish (telefon qotib qolmasligi uchun)
        const f = upFit(src.w, src.h, scale), cv = document.createElement("canvas");
        cv.width = f.w; cv.height = f.h; const cx = cv.getContext("2d"); cx.imageSmoothingQuality = "high"; cx.drawImage(src.img, 0, 0, f.w, f.h);
        bar({t:"Tiniqlashtirilmoqda...", v:0});
        const blob = await upRun(cv, scale, v => { if($("#uout")) bar({t:"Tiniqlashtirilmoqda...", v}); });
        if(out) URL.revokeObjectURL(out.url);
        out = {url:URL.createObjectURL(blob), w:f.w*scale, h:f.h*scale, size:blob.size};
        if(!$("#uout")) return;
        const sec = Math.max(1, Math.round((Date.now()-t0)/1000));
        $("#uout").innerHTML = `<div class="upres">
          <div class="upcmp" id="ucmp" style="--x:50%;aspect-ratio:${out.w}/${out.h};width:min(100%, calc(70vh * ${(out.w/out.h).toFixed(4)}))"><img src="${out.url}" alt="Keyin"><img class="upb" src="${src.url}" alt="Oldin">
            <span class="uplb l">Oldin</span><span class="uplb r">Keyin · ${scale}x</span><span class="upln"><i>⟷</i></span>
            <input type="range" min="0" max="100" value="50" aria-label="Solishtirish"></div>
          <div class="upact"><span>${out.w}×${out.h} · ${(out.size/1024/1024).toFixed(2)} MB · ${sec} s</span><div class="flex1"></div>
            <a class="btn-k" href="${out.url}" download="${esc(src.name)}-${scale}x.png">${IC.dl} PNG yuklab olish</a></div></div>`;
        const cmp = $("#ucmp"); cmp.querySelector("input").oninput = e => cmp.style.setProperty("--x", e.target.value + "%");
      }catch(e){
        console.error(e);
        if($("#uout")) $("#uout").innerHTML = `<div class="msg err">${/fetch|network|load|script/i.test(String(e&&e.message||e)) ? "Model yuklanmadi. Internetni tekshirib, qayta urinib ko'ring." : "Rasmni qayta ishlab bo'lmadi. Kichikroq rasm yoki 2x bilan urinib ko'ring."}</div>`;
      }finally{
        BUSY = false; if($("#ugo")){ go.innerHTML = IC.up; go.disabled = !src; }
      }
    };
  },

function splitChapters(text){
  text = text.replace(/\r/g,"").trim();
  const re = /^(?:\s*)((?:\d+[\s.\-)]*-?\s*bob\b.*)|(?:bob\s*\d+.*)|(?:chapter\s+\w+.*)|(?:glava\s+\w+.*)|(?:глава\s+\S+.*)|(?:#{1,3}\s+.+))$/gim;
  const marks = [...text.matchAll(re)];
  let ch = [];
  if(marks.length >= 2){
    marks.forEach((m,i) => { const s = m.index, e = i+1<marks.length ? marks[i+1].index : text.length;
      const body = text.slice(s + m[0].length, e).trim(); if(body) ch.push({title: m[1].replace(/^#+\s*/,"").trim().slice(0,80), text: body}); });
    const pre = text.slice(0, marks[0].index).trim(); if(pre) ch.unshift({title:"Kirish", text:pre});
  }
  if(!ch.length){
    const paras = text.split(/\n\s*\n/); let cur = "";
    paras.forEach(p => { if((cur+"\n\n"+p).length > 4000 && cur){ ch.push({text:cur}); cur = p; } else cur = cur ? cur+"\n\n"+p : p; });
    if(cur) ch.push({text:cur});
    ch = ch.map((c,i)=>({title:`${i+1}-qism`, text:c.text}));
  }
  return ch;
}

const niceMax = m => { if(m <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(m))), s = m/p; return (s<=1?1:s<=2?2:s<=2.5?2.5:s<=5?5:10)*p; };
const fshort = v => v >= 1e6 ? (v/1e6).toFixed(1).replace(".0","")+"M" : v >= 1000 ? (v/1000).toFixed(v>=1e4?0:1).replace(".0","")+"k" : String(Math.round(v));
const dlab = (d, short) => { const t = today2(); if(d===t) return "Bugun"; const [y,m,dd] = d.split("-"); return short ? `${+dd}.${m}` : `${+dd}.${m}.${y}`; };
function today2(){ const d = new Date(Date.now() + (5*60 + new Date().getTimezoneOffset())*60000); return d.toISOString().slice(0,10); }
const fdate = s => { const d = new Date(s); return isNaN(d) ? "—" : d.toLocaleDateString("ru-RU"); };
const fago = s => { const d = new Date(s); return isNaN(d) ? "—" : ago(d.getTime()); };

function barChart(title, sub, days, vals, unit){
  const mx = niceMax(Math.max(...vals, 0)), total = vals.reduce((a,b)=>a+b,0);
  return `<div class="box pad chc"><div class="chh"><div><b>${title}</b><small>${sub}</small></div><span class="chv">${fmt(total)}<small> ${unit}</small></span></div>
    <div class="cg"><div class="yax"><span>${fshort(mx)}</span><span>${fshort(mx/2)}</span><span>0</span></div>
      <div class="plot"><i class="gl1" style="top:0"></i><i class="gl1" style="top:50%"></i><i class="gl1 base" style="top:100%"></i>
      ${vals.map((v,i)=>`<div class="bc" tabindex="0"><div class="bar ${v?"":"z"}" style="height:${v/mx*100}%"></div>
        <div class="tt"><b>${fmt(v)} ${unit}</b><small>${dlab(days[i])}</small></div><em>${i%2===1||i===days.length-1?dlab(days[i],true):""}</em></div>`).join("")}</div></div></div>`;
}

async function payReturn(){
  let bill = ""; try{ bill = localStorage.getItem("ovoz_bill") || ""; }catch(e){}
  const back = /[?&]paid=1/.test(location.hash);
  if(!bill && !back) return;
  const box = () => $("#paybx");
  const show = (cls, ic, t, s, btn="") => { if(box()) box().innerHTML = `<div class="paybx ${cls}"><span class="pi">${ic}</span><div class="flex1"><b>${t}</b><small>${s}</small></div>${btn}</div>`; };
  show("", '<span class="spin"></span>', "To'lov tekshirilmoqda...", "TezCheck'dan javob kutilmoqda, bir necha soniya.");
  for(let i=0; i<12; i++){
    const r = await api("pay_check", {bill});
    if(!box()) return;
    if(!r.ok){ show("bad", IC.x, "Tekshirib bo'lmadi", esc(apiFail(r).error || "Birozdan keyin sahifani yangilang.")); return; }
    if(r.state==="paid"){
      try{ localStorage.removeItem("ovoz_bill"); }catch(e){}
      if(r.user){ USER = r.user; paintUser(); }
      if(back) history.replaceState(null, "", "#/app/plans");
      PAGES.plans();
      show("ok", IC.check, `To'lov qabul qilindi — ${esc(planName(r.plan))} tarifi yoqildi! 🎉`, USER.planUntil ? `${fdate(USER.planUntil)} gacha amal qiladi. Rahmat!` : "Rahmat!");
      try{ Gapi.dance(); }catch(e){}
      return;
    }
    if(r.state==="test"){ try{ localStorage.removeItem("ovoz_bill"); }catch(e){}
      show("bad", IC.x, "Bu test to'lovi edi", "Test rejimidagi to'lov faqat admin akkauntida tarifni yoqadi."); return; }
    if(r.state==="none" || ["expired","revoked","exhausted"].includes(r.state)){ try{ localStorage.removeItem("ovoz_bill"); }catch(e){}
      if(back) show("bad", IC.x, "To'lov topilmadi yoki bekor qilindi", "Agar pul yechilgan bo'lsa, yordam bo'limiga yozing.", `<a class="btn-l" target="_blank" rel="noopener" href="${esc(CONFIG.CONTACT_URL)}">Yordam</a>`);
      else if(box()) box().innerHTML = "";
      return; }
    if(!back && i===0){ if(box()) box().innerHTML = ""; return; }   // to'lov sahifasidan qaytmagan — kutib turmaymiz
    await new Promise(res => setTimeout(res, 4000));
  }
  show("", IC.card, "To'lov hali tasdiqlanmagan", "To'lagan bo'lsangiz, bir daqiqadan so'ng sahifani yangilang — tarif avtomatik yoqiladi.", `<button class="btn-l" onclick="PAGES.plans()">${IC.reset} Tekshirish</button>`);
}

  const {el, close} = modal(`<div class="mdh"><div><b>${esc(u.name)}</b><small>${fmtPhone(u.phone)} · ro'yxatdan: ${fdate(u.createdAt)}</small></div><button class="ib" data-close>${IC.x}</button></div>
