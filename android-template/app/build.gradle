plugins { id 'com.android.application' }

def gapirAppId = project.findProperty('appId') ?: 'uz.gapir.app'

android {
    namespace 'uz.gapir.app'
    compileSdk 34
    defaultConfig {
        applicationId gapirAppId
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
